
[loot_chests]
	#Sollen MyMusic Discs in Loot-Kisten (Dungeons, Mineshafts, etc.) auftauchen können?
	enabled = true
	#Wahrscheinlichkeit (0.0 bis 1.0), dass eine betroffene Kiste EINE zufällige Disc enthält.
	#0.2 = 20% Chance pro Kiste. Nur relevant wenn 'enabled' true ist.
	#Range: 0.0 ~ 1.0
	chance = 0.2
	#Liste der Loot-Table-IDs, in denen Discs auftauchen können.
	#Eigene/modded Loot-Tables können hier ergänzt werden (z.B. "modid:chests/xyz").
	tables = ["minecraft:chests/simple_dungeon", "minecraft:chests/abandoned_mineshaft", "minecraft:chests/stronghold_corridor", "minecraft:chests/stronghold_crossing", "minecraft:chests/stronghold_library", "minecraft:chests/jungle_temple", "minecraft:chests/desert_pyramid", "minecraft:chests/woodland_mansion", "minecraft:chests/ancient_city", "minecraft:chests/bastion_treasure", "minecraft:chests/nether_bridge", "minecraft:chests/shipwreck_treasure", "minecraft:chests/buried_treasure", "minecraft:chests/village/village_desert_house", "minecraft:chests/village/village_plains_house"]

[mob_drops]
	#Sollen feindliche Mobs beim Tod gelegentlich eine Disc fallen lassen können?
	enabled = true
	#Wahrscheinlichkeit (0.0 bis 1.0), dass ein getöteter feindlicher Mob EINE zufällige Disc droppt.
	#0.002 = 0.2% Chance pro Kill. Nur relevant wenn 'enabled' true ist.
	#Range: 0.0 ~ 1.0
	chance = 0.002

[ambient_music]
	#Welche Disc-Nummern sollen ZUSAETZLICH als normale Hintergrundmusik in der
	#Overworld (und Caves&Cliffs-Biomen) auftauchen? Nur die Nummer eintragen, z.B.:
	#background_music_discs = [1, 4, 6, 12, 41]
	#Leere Liste [] deaktiviert die Ambient-Music-Funktion komplett.
	background_music_discs = [5, 19, 27, 31, 33, 35, 36, 38]

