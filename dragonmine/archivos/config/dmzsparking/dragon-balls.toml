
#Black Star and corrupted Dragon Balls of the GT story.
[personalDragonBalls]
	#The story hands out these balls. false = none are handed out (balls already owned stay).
	enabled = true
	#A completed GT quest lays its Black Star ball on the quest's planet near the player instead of handing it over. false = handed over as before.
	blackStarOnPlanets = true
	#Closest a laid Black Star ball lies to the player, in blocks. 0 = it may lie at his feet.
	#Range: 0 ~ 128
	blackStarMinDistance = 24
	#Farthest a laid Black Star ball lies from the player, in blocks (below the minimum it counts as the minimum).
	#Range: 0 ~ 128
	blackStarMaxDistance = 64

