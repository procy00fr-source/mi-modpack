
#Broly's rampage on Vampa.
[brolyRampage]
	#Minecraft days before a player can start a rampage again. 0 = no rest.
	#Range: 0 ~ 60
	restDays = 3
	#Minecraft days of rest after a called-off rampage. 0 = no rest.
	#Range: 0 ~ 60
	calledOffRestDays = 1
	#Training points per fighter when Broly is calmed. 0 = none.
	#Range: 0 ~ 100000000
	rewardTp = 120000

#Vampa's beasts, as shares of Paragus' film fight.
[beasts]
	#A goliamite's health as a share of Paragus'.
	#Range: 1.0E-6 ~ 10.0
	goliamiteLifeOfParagus = 0.025
	#A goliamite's melee as a share of Paragus'. 0 = no damage.
	#Range: 0.0 ~ 10.0
	goliamiteMeleeOfParagus = 0.25
	#A great beast's health as a share of Paragus'.
	#Range: 1.0E-6 ~ 10.0
	beastLifeOfParagus = 1.0
	#A great beast's bite as a share of Paragus' melee. 0 = no damage.
	#Range: 0.0 ~ 10.0
	beastMeleeOfParagus = 1.0
	#Goliamites at most within 64 blocks of a player. 0 = none.
	#Range: 0 ~ 64
	goliamitesPerPlayer = 16
	#Goliamites at most within 64 blocks of a place. 0 = none.
	#Range: 0 ~ 128
	goliamitesLocal = 24
	#Minecraft days a great beast stays away after it died. 0 = back at once.
	#Range: 0 ~ 60
	beastAwayDays = 3

