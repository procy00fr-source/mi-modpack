
#Gravity on Vegeta.
[vegeta]
	#Vegeta has its own gravity for visitors. false = the world's default gravity.
	enabled = true
	#Vegeta's gravity for visitors. 1 or less = no effect.
	#Range: 0.0 ~ 1000.0
	value = 10.0

	#Getting used to Vegeta's gravity by training.
	[vegeta.adaptation]
		#Gravity felt at each later stage, in order. Empty = used to it after the first stage.
		stages = [6.0, 3.0]
		#Unused since gravity mastery. Training actions per stage.
		#Range: 1 ~ 1000000
		actionsPerStage = 150
		#Unused since gravity mastery. Gravity device setting from which training counted.
		#Range: 1.0 ~ 1000.0
		deviceMinimum = 10.0

#Gravity mastery: getting used to gravity by training.
[mastery]
	#Mastery lowers gravity penalties and raises TP. false = DragonMineZ unchanged, values stay saved.
	enabled = true
	#Gravity stages to master, in g. Empty = nothing to master.
	stages = [2.0, 5.0, 10.0, 20.0, 30.0, 50.0, 75.0, 100.0, 150.0, 200.0, 250.0, 300.0, 350.0, 400.0, 450.0, 500.0, 550.0, 600.0, 650.0, 700.0, 750.0, 800.0, 850.0, 900.0, 950.0, 1000.0]
	#Training actions for the 10 g stage; a stage s needs base * sqrt(s / 10).
	#Range: 1 ~ 1000000
	actionsBase = 100
	#TP factor at full mastery. 1 = no TP reward.
	#Range: 1.0 ~ 10.0
	tpMultiplierMax = 1.5
	#Mastery in g that gives the full TP factor.
	#Range: 2.0 ~ 1000000.0
	tpFullMastery = 1000.0

