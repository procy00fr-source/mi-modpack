
#Planet protection: free occupied planets from Frieza's soldiers, then guard them and receive tribute.
[planetGuard]
	#Allows liberations and counter-attacks. false = none start; protectors keep their planets.
	enabled = true
	#Planets that can be freed, as name=tier (tier 1-5). Names: imecka, beehay, luud, m2, tuffle, yardrat, vampa, zuno, new_vegeta, ... Empty = none.
	planets = ["imecka=1", "beehay=2", "luud=3", "m2=4", "tuffle=5", "yardrat=1", "vampa=2"]
	#Waves per tier 1-5 (one entry per tier; a short list repeats its last value). At least 1 wave is fought.
	wavesPerTier = [2, 3, 3, 4, 5]
	#Soldiers per wave for one player, per tier 1-5.
	soldiersPerTier = [4, 5, 6, 7, 8]
	#Extra soldiers per further player, in percent of the one-player number. 0 = no extra.
	#Range: 0 ~ 400
	extraPlayerPercent = 50
	#Most soldiers in one wave.
	#Range: 1 ~ 64
	maxGroup = 16
	#Seconds between two waves. 0 = the next wave comes at once.
	#Range: 0 ~ 300
	wavePauseSeconds = 8
	#Life of one soldier per tier 1-5 (DragonMineZ' scale; with the Overhaul multiplied by its scale).
	healthPerTier = [40000.0, 60000.0, 85000.0, 120000.0, 160000.0]
	#Melee damage of one soldier per tier 1-5.
	meleePerTier = [1700.0, 2500.0, 3600.0, 5000.0, 6700.0]
	#Ki blast damage of one soldier per tier 1-5.
	kiPerTier = [1500.0, 2300.0, 3200.0, 4500.0, 6000.0]

#What a freed planet gives and asks.
[protection]
	#Ticks of one tribute day (24000 = one Minecraft day). 0 = no tribute and no counter-attacks.
	#Range: 0 ~ 10000000
	dayTicks = 24000
	#Tribute days stored at most until collected. 0 = no limit.
	#Range: 0 ~ 3650
	maxStoredDays = 7
	#Tribute per day as 'item_id count'; the count is multiplied by the planet's tier. Empty = no item tribute.
	tributeItems = ["minecraft:emerald 1"]
	#Chance in percent per day that a freed planet is attacked again. 0 = never.
	#Range: 0 ~ 100
	counterAttackChance = 15
	#Seconds a protector may be logged out during a counter-attack before the planet is lost. 0 = lost at once.
	#Range: 0 ~ 3600
	logoutGraceSeconds = 120

#Frieza's empire grows: his army takes free planets now and then, by the world's story (the furthest any player has come):
#before Frieza falls on Namek (frieza_saga:16), his remnants after it, his return from Resurrection F on.
[empire]
	#Planets of the list above that belong to Frieza's empire when a world first meets it; the others start free.
	#Read once per world. A planet added to the list later starts occupied.
	startOccupied = ["imecka", "luud", "m2", "tuffle"]
	#Lets Frieza's army land on free planets (a world event, announced to everyone); whoever beats a landing off becomes the planet's protector.
	#On by default (Yami 16.11.2026: Frieza's empire grows). false = no landings.
	subjugation = true
	#Minutes between two landings, for the eras empire, remnants, return (a short list repeats its last value). 0 = none in that era.
	#The clock runs while players are online.
	intervalMinutesPerEra = [90, 360, 120]
	#Most planets Frieza's army holds and lands on together, per era (empire, remnants, return). A landing never goes beyond it.
	maxHeldPerEra = [5, 2, 4]
	#Minutes from the announcement of a landing until the planet is taken - the time to come and fight it off.
	#Range: 1 ~ 1440
	warningMinutes = 10

