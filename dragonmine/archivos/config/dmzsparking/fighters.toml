
#Roaming fighters.
[fighters]
	#Fighters appear. false = no new encounters (met fighters stay saved).
	enabled = true
	#Saiyan fighters roam Vegeta. false = none there.
	vegeta = true
	#Namekian warriors roam Namek. false = none there.
	namek = true
	#Fighters at most within 160 blocks of a player. 0 = none.
	#Range: 0 ~ 32
	nearbyFighterCap = 3
	#Living fighters per planet at most. 0 = none.
	#Range: 0 ~ 1024
	worldStock = 48
	#Seconds between two encounter checks per player.
	#Range: 5 ~ 3600
	checkSeconds = 45
	#Chance in percent that a check brings an encounter. 0 = never.
	#Range: 0 ~ 100
	encounterChance = 25
	#Growth speed in percent. 0 = no growth.
	#Range: 0 ~ 1000
	growthPercent = 100
	#Minecraft days of absence caught up at most. 0 = none.
	#Range: 0 ~ 60
	catchUpDays = 7
	#Friendship needed before a fighter joins as a companion.
	#Allowed Values: NEMESIS, ENEMY, TENSE, NEUTRAL, FAMILIAR, FRIEND, CLOSE_FRIEND, TRUSTED_ALLY
	recruitStage = "FRIEND"

#How fighters live, grow, travel and die.
[livingWorld]
	#Fighters roam Earth. false = none there.
	earth = true
	#REAL = a fighter can die for good. KNOCKOUT = he withdraws and returns later.
	#Allowed Values: REAL, KNOCKOUT
	death = "REAL"
	#Fighters have DragonMineZ' six stats. false = a single power number.
	dmzStatGrowth = true
	#Fighters can unlock their race's forms. false = no forms.
	forms = true
	#Fighters walk to known places. false = they stay near home.
	explore = true
	#Fighters who meet spar each other. false = no sparring between fighters.
	fighterRivals = true
	#OFF = never. WITH_PLAYERS = only as a companion. ON_THEIR_OWN = also on their own.
	#Allowed Values: OFF, WITH_PLAYERS, ON_THEIR_OWN
	travelBetweenPlanets = "WITH_PLAYERS"
	#A fallen fighter can be revived by a wish. false = not revivable.
	revivalByWish = true

	[livingWorld.companions]
		#Companion growth cap in percent of the owner's battle power.
		#Range: 10 ~ 100
		capShare = 50
		#Companion fighting mode until chosen: HELP_ALWAYS, WHEN_HIT or STAY_OUT.
		#Allowed Values: HELP_ALWAYS, WHEN_HIT, STAY_OUT
		defaultFightMode = "HELP_ALWAYS"
		#A companion's training focus also applies at home. false = only with the owner.
		trainingWhileAway = true
		#A companion can take the owner as master. false = never.
		playerAsMaster = true
		#Companions one player can lead at once.
		#Range: 1 ~ 8
		maxPerPlayer = 5

	#Living fighters per planet. -1 = use fighters.worldStock.
	[livingWorld.planetStock]
		#Living fighters on Earth at most. -1 = worldStock, 0 = none.
		#Range: -1 ~ 1024
		earth = -1
		#Living fighters on Vegeta at most. -1 = worldStock, 0 = none.
		#Range: -1 ~ 1024
		vegeta = -1
		#Living fighters on Namek at most. -1 = worldStock, 0 = none.
		#Range: -1 ~ 1024
		namek = -1

	#Fighters climbing their race's forms.
	[livingWorld.formLadder]
		#Minecraft days a fighter spends in a form before the next. 0 = no wait.
		#Range: 0 ~ 60
		masteryDays = 2
		#Strongest form fighters on Earth can reach (e.g. "supersaiyan.supersaiyan3"). Empty = no limit.
		highestFormEarth = ""
		#Strongest form fighters on Vegeta can reach. Empty = no limit.
		highestFormVegeta = ""
		#Strongest form fighters on Namek can reach. Empty = no limit.
		highestFormNamek = ""

	#Fighters teaching weaker fighters.
	[livingWorld.mentors]
		#Fighters take students. false = no new pairs.
		enabled = true
		#Master and student pairs per planet at most. 0 = none.
		#Range: 0 ~ 16
		pairsPerPlanet = 3
		#How much stronger a master must be, in percent of the student's power.
		#Range: 110 ~ 1000
		strongerPercent = 200
		#A student's growth speed in percent.
		#Range: 100 ~ 500
		studentTempo = 150
		#Fighters one player can have as master at once. 0 = none.
		#Range: 0 ~ 1
		playerMasters = 1
		#Fighters one player can teach at once. 0 = none.
		#Range: 0 ~ 8
		playerStudents = 3

	[livingWorld.ritual]
		#Saiyan fighters and companions can join the God ritual circle. false = players only.
		npcDonors = true
		#Friendship a fighter needs to join the circle.
		#Allowed Values: NEMESIS, ENEMY, TENSE, NEUTRAL, FAMILIAR, FRIEND, CLOSE_FRIEND, TRUSTED_ALLY
		npcMinStage = "CLOSE_FRIEND"
		#Minutes a fighter rests after the ritual. 0 = no rest.
		#Range: 0 ~ 600
		npcCooldownMinutes = 30

	#How fighters grow and reach their forms.
	[livingWorld.progress]
		#Fighters grow without a ceiling, as players do (DragonMineZ' own stat limit is the only one). false = the old era ceiling.
		noCeiling = true
		#Share of new fighters born with low talent (70 % growth), in parts of the four. 0 = none.
		#Range: 0 ~ 100
		talentLow = 8
		#Share of new fighters born with standard talent (100 % growth), in parts. 0 = none.
		#Range: 0 ~ 100
		talentStandard = 57
		#Share of new fighters born with high talent (130 % growth), in parts. 0 = none.
		#Range: 0 ~ 100
		talentHigh = 28
		#Share of new fighters born with exceptional talent (160 % growth), in parts. 0 = none.
		#Range: 0 ~ 100
		talentExceptional = 7
		#A rank is earned by training, fights and wins together with power. false = by power alone, as before.
		rankFromDeeds = true
		#A defeat teaches a lesson (a training focus), never a form. false = a lost spar or a knock-out may open a form, as before.
		lessonFromDefeat = true
		#Fighters use and learn forms only once the story has reached them (a companion: the owner's story, others: the world's). false = any form.
		formsByStory = true
		#At the first start after this update, forms a fighter already holds before their story stay unused until the story gets there (nothing is taken away). false = such forms stay usable.
		lockEarlyFormsOnUpdate = true

	#Where fighters are met.
	[livingWorld.ownLives]
		#Blocks from a fighter's place at which his body appears for a player coming there. 0 = no bodies.
		#Range: 0 ~ 256
		presenceReach = 96
		#Every player gets a personal rival who grows along with him. false = none.
		personalRival = true
		#The rival seeks the player out at a milestone (a new form, a saga's end), announced first. false = he waits to be found.
		rivalChallenges = true

	#How fighters feel, remember and spend their days, and what players do with them.
	[livingWorld.life]
		#Fighters have moods that fade and change how they fight, talk and spend the day. false = always calm.
		moods = true
		#Fighters befriend each other (0-12) and grieve for fallen friends. false = no bonds between fighters.
		npcBonds = true
		#The life card offers topics, each with an effect on mood and friendship. false = only asking about the day.
		talkOptions = true
		#Fighters nearby react to a player's transformation or sudden rise of power. false = they ignore it.
		reactToPlayer = true
		#Friends within 48 blocks come to help a player below a third of his health (never in story fights). false = never.
		friendsIntervene = true
		#Friendship a fighter needs to come to a player's help.
		#Allowed Values: NEMESIS, ENEMY, TENSE, NEUTRAL, FAMILIAR, FRIEND, CLOSE_FRIEND, TRUSTED_ALLY
		interveneStage = "CLOSE_FRIEND"
		#Fighters spend parts of their day fishing, stargazing, hunting dinosaurs and more. false = the plain day plan.
		activities = true
		#Share of a fighter's day slices filled with an everyday activity, in percent. 0 = none.
		#Range: 0 ~ 100
		activityShare = 60
		#Players can join a fighter's activity for friendship and a small reward. false = only watching.
		joinActivities = true
		#Training points for joining an active activity, once a day each. 0 = no points.
		#Range: 0 ~ 10000
		joinRewardTp = 25
		#Fighters play rock-paper-scissors, shadowboxing and mining contests and hide and seek with players. false = no games.
		games = true
		#A player can give his companion a bed; he sleeps there at night and it is his home. false = no beds.
		beds = true
		#A friend now and then asks a player along to a real place of his life (home, a friend, a known place). false = never.
		goAlong = true
		#Minutes at least between two such invitations of one fighter. 0 = never.
		#Range: 0 ~ 1440
		goAlongMinutes = 20
		#Chance in percent per Minecraft day that a close friend visits a player at home, announced first. 0 = never.
		#Range: 0 ~ 100
		visitPercent = 5
		#Players with ki sense or a scouter feel strong fights and new forms far off. false = never.
		kiSense = true
		#Blocks at most at which such a power is felt. 0 = never.
		#Range: 0 ~ 4096
		kiSenseRange = 512
		#Minutes at least between two such messages to one player. 0 = no wait.
		#Range: 0 ~ 120
		kiSenseMinutes = 3
		#A fight is felt when its stronger side reaches this percent of the player's power. 0 = any fight.
		#Range: 0 ~ 1000
		kiSenseShare = 50
		#Fighters on Vegeta fight Frieza's soldiers during the attack, never taking the last blow. false = they stay out.
		invasionHelp = true
		#Friends who come to watch a player's Cell Games from the edge of the ring. 0 = none.
		#Range: 0 ~ 8
		cellGamesSpectators = 3
		#Fighters speak of the sagas a player finished since they last met, and of friends lost. false = never.
		sagaComments = true
		#Hunting fighters also hunt wild Minecraft animals, not only DragonMineZ' dinosaurs. false = dinosaurs only.
		huntAnimals = false
		#Minutes between two lines of a following companion. 0 = silent.
		#Range: 0 ~ 120
		companionChatter = 5

	#The canon cast as fighters, a companion of one's own, fusion and merging with companions.
	[livingWorld.canon]
		#Canon figures (Krillin, Piccolo, Goku, Vegeta ...) settle in the world once a player's story passed their saga. false = none come.
		figures = true
		#Former villains (Vegeta, Cell, Frieza after Golden Frieza) come too and go along after a won spar. false = only heroes.
		villains = true
		#Blocks within which a canon figure steps aside while another body of the same person stands (a scene, a quest, a master). 0 = never.
		#Range: 0 ~ 256
		stepAsideBlocks = 64
		#Shenron brings a fallen companion or canon figure back once; Porunga and Super Shenron as often as wished (the canon). false = Shenron as often as wished too.
		revivalOncePerDragon = true
		#Shenron offers to create a companion of one's own (race, personality, look, clothes). false = no such wish.
		wishCompanion = true
		#Mr. Popo cuts a companion's hair when his owner stands by Popo with him. false = players only.
		popoHaircut = true
		#A player fuses with a fighter companion by DragonMineZ' fusion dance or Potara. false = players only.
		companionFusion = true
		#A Namekian merges with a Namekian companion for good (DragonMineZ' assimilation). false = never.
		namekMerge = true
		#Shenron and Porunga offer to undo a merge with a companion. false = a merge stays.
		undoWish = true

	#How fighters and companions fight.
	[livingWorld.combat]
		#Fighters fight with the director: phases, combos, technique by distance, answers to a charging foe. false = DragonMineZ' saga brain alone.
		director = true
		#Fighters and companions per server thinking with the director at once. 0 = none.
		#Range: 0 ~ 256
		maxThinking = 24
		#Ki techniques of fighters and companions break blocks. false = never.
		npcKiBreaksBlocks = false
		#Two fighters in a spar meet in a beam duel and a climb into the sky once a fight. false = never.
		beamDuels = true
		#A senzu bean given to a companion or a friend heals him, or is kept for the fight (at most 2). false = not taken.
		senzuForFighters = true
		#Companions help in their owner's quest fights on Normal only, as weak as story allies (never the last blow). false = they stay out.
		companionStoryHelp = true

	#The person view in the menu.
	[livingWorld.profile]
		#In-game days the LIFE tab's journal reaches back (today counts). 0 = no journal.
		#Range: 0 ~ 60
		journalDays = 7

