
#Whis and Beerus training.
[training]
	#Gravity during Whis' run under load.
	#Range: 1.0 ~ 100.0
	runGravity = 3.0
	#Gravity of the three gravity meditation stages, in order.
	meditationGravity = [2.0, 5.0, 10.0]
	#Seconds of the first meditation lesson.
	#Range: 30 ~ 1800
	meditationSeconds = 120
	#Seconds of the gravity meditation.
	#Range: 60 ~ 1800
	gravityMeditationSeconds = 300
	#Allowed deviation from the release target, in percent points.
	#Range: 6 ~ 25
	releaseTolerance = 6
	#Ticks to react to a new release target. 0 = only the travel time.
	#Range: 0 ~ 200
	releaseReactionTicks = 30
	#Ticks the release may stay off target before it counts as a mistake.
	#Range: 10 ~ 200
	releaseGraceTicks = 40
	#Ticks each release target must be held.
	#Range: 20 ~ 400
	releaseHoldTicks = 60
	#Ticks to react to Whis' first signal. Never less than 30 (1.5 s); a late answer costs only that signal.
	#Range: 6 ~ 200
	signalWindowFirstTicks = 40
	#Ticks to react to his last signal. Never less than 30 (1.5 s).
	#Range: 6 ~ 200
	signalWindowLastTicks = 30
	#Wind-up ticks of Whis' first attacks. Never less than 30 (1.5 s).
	#Range: 6 ~ 100
	windupFirstTicks = 40
	#Wind-up ticks of his fastest attacks. Never less than 30 (1.5 s).
	#Range: 6 ~ 100
	windupLastTicks = 30
	#No longer read: since 1.5.1 a hit only goes uncounted and never ends the Sign or Mastered test.
	#Range: 0 ~ 20
	sectionErrors = 2
	#Protected radius in blocks around the settlement in Beerus' mission.
	#Range: 16 ~ 128
	missionRadius = 40
	#Raiders in Beerus' mission.
	#Range: 1 ~ 12
	raiders = 4
	#Beerus' final fight: multiple of Jiren's health, melee and ki.
	#Range: 0.1 ~ 20.0
	beerusFactor = 1.5

#Uub's trial for the human Majuub form.
[uubTrial]
	#Required level of the human super form.
	#Range: 1 ~ 10
	superLevel = 3
	#Required mastery of that form in percent. 0 = none.
	#Range: 0.0 ~ 100.0
	mastery = 50.0

#Pybara's Instant Transmission trial on Yardrat.
[yardratTrial]
	#Minutes of rest after a passed trial before the next level can be tried. 0 = no rest.
	#Range: 0 ~ 100000
	restMinutes = 20

#Ultra Instinct's own dodge while the form is active.
[ultraInstinct]
	#Ultra Instinct dodges by itself. false = DragonMineZ' normal speed dodge.
	dodge = true
	#It also dodges ki blasts (never beams or supers).
	kiBlasts = true
	#Sign: dodge chance at mastery 0, in percent.
	#Range: 0.0 ~ 100.0
	signChanceMin = 20.0
	#Sign: dodge chance at mastery 100, in percent.
	#Range: 0.0 ~ 100.0
	signChanceMax = 40.0
	#Mastered: dodge chance at mastery 0, in percent.
	#Range: 0.0 ~ 100.0
	masteredChanceMin = 40.0
	#Mastered: dodge chance at mastery 100, in percent.
	#Range: 0.0 ~ 100.0
	masteredChanceMax = 65.0
	#Percent added per lesson passed with Whis (three lessons). 0 = none.
	#Range: 0.0 ~ 20.0
	whisLessonBonus = 2.0
	#Chance against players, as a share of the chance against mobs.
	#Range: 0.0 ~ 1.0
	pvpFactor = 0.7
	#Sign: each dodge in a row multiplies the next chance by this. 1 = no penalty.
	#Range: 0.0 ~ 1.0
	signStreak = 0.75
	#Mastered: the same for Mastered. 1 = no penalty.
	#Range: 0.0 ~ 1.0
	masteredStreak = 0.85
	#Ticks without a dodge after which the row starts again.
	#Range: 1 ~ 1200
	streakResetTicks = 60
	#Sign: ki per dodge, in percent of max ki. 0 = free.
	#Range: 0.0 ~ 100.0
	signKiCost = 5.0
	#Mastered: ki per dodge, in percent of max ki. 0 = free.
	#Range: 0.0 ~ 100.0
	masteredKiCost = 2.5
	#Ticks between two dodges.
	#Range: 0 ~ 200
	cooldownTicks = 10
	#Seconds in Ultra Instinct until its dodge chance has fallen to the floor below; reverting starts again. 0 = never falls.
	#Range: 0 ~ 3600
	dodgeFadeSeconds = 180
	#Share of the dodge chance left once it has fallen, in percent. 100 = it does not fall.
	#Range: 0.0 ~ 100.0
	dodgeFadeFloor = 50.0
	#Mastered: a hit that lands anyway does this much less damage, in percent. 0 = none.
	#Range: 0.0 ~ 90.0
	masteredHarden = 25.0
	#With the Divine Kamehameha learned, Ultra Instinct also slides past beams. false = beams always hit.
	glide = true
	#Ki per glide past a beam, in percent of max ki. 0 = free.
	#Range: 0.0 ~ 100.0
	glideKiCost = 10.0

#Ultra Ego's meter: fills with damage taken, raises damage dealt.
[ultraEgo]
	#Ultra Ego has its meter.
	meter = true
	#Sign: extra damage at a full meter, in percent.
	#Range: 0 ~ 100
	signBonus = 5
	#Mastered: extra damage at a full meter, in percent.
	#Range: 0 ~ 100
	masteredBonus = 10
	#Meter percent per percent of max health lost.
	#Range: 0.01 ~ 100.0
	fillPerHealth = 1.0
	#Ticks without a hit taken or given after which the fight is over and the meter empties.
	#Range: 20 ~ 12000
	fightEndTicks = 200
	#The aura destroys plain ki blasts on contact (never beams or supers). false = they hit.
	auraBreaksBlasts = true
	#A hit blocked with DragonMineZ' block loses this much more damage, in percent. 0 = DragonMineZ' block only.
	#Range: 0.0 ~ 100.0
	counterReduce = 60.0
	#Extra damage dealt after such a block, in percent. 0 = none.
	#Range: 0.0 ~ 200.0
	counterBonus = 15.0
	#Seconds that extra damage lasts.
	#Range: 2 ~ 30
	counterSeconds = 3

#The Limit Breaker ritual in Goku's menu.
[limitBreaker]
	#Donors needed: players or your own companions.
	#Range: 1 ~ 12
	donors = 4
	#Forms a donor must be in, as group.form.
	donorForms = ["godforms.supersaiyangod", "godforms.supersaiyanblue", "godforms.supersaiyanblueevolved", "godforms.supersaiyanblueperfected"]
	#Quest that must be done first. Empty = none.
	afterQuest = "dmzsparking_s5_top:35"

#Zamasu's lesson in the Sacred World of Universe 10.
[zamasuBlade]
	#Extra melee damage of a drawn Ki Blade or Ki Scythe once learned, in percent. 0 = no bonus.
	#Range: 0 ~ 500
	bladeBonusPercent = 25

#Inside Whis' staff: Whis takes a pupil with Divine Ki into the world inside his staff.
[whisStaff]
	#true = Whis offers the staff in his menu. false = no staff.
	enabled = true
	#Form mastery inside, as a multiple of DragonMineZ' passive gain of the worn form and stack. 1 = no extra.
	#Range: 1.0 ~ 100.0
	masteryMultiplier = 12.0
	#Power release in percent the pupil must stay at or below to move against the godly ki. 100 = no pressure.
	#Range: 0 ~ 100
	releaseCeiling = 30
	#Ticks the release must stay at or below that ceiling before the body moves (20 ticks = 1 second). 0 = at once.
	#Range: 0 ~ 2400
	holdTicks = 100
	#Minutes of one visit before Whis brings the pupil back. 0 = no limit.
	#Range: 0 ~ 100000
	visitMinutes = 30
	#TP inside while the ki is held down, as a multiple of DragonMineZ' Time Chamber extra (HTCTpMultiplier - 1).
	#1 = as in the Time Chamber, 0 = no TP extra inside. Leaking ki pays no extra at all.
	#Range: 0.0 ~ 20.0
	tpMultiplier = 1.5

#The new forms of humans, Majin, Glind and rebuilt humans.
[newForms]
	#Fused Android mastery in percent before Gero offers the merge with Hell Fighter 17.
	#Range: 0.0 ~ 100.0
	super17Mastery = 50.0
	#Not read since 1.5.1's two android lines: Majin Cells opens at Fused Android mastery 50 (see the handbook, Android lines).
	#Range: 0.0 ~ 100.0
	android21Mastery = 50.0
	#Absorber+ (Hell Fusion; twice from Further Evolution): extra share of the Ki DragonMineZ' Android barrier converts. 0 = off.
	#Range: 0.0 ~ 5.0
	absorberBonus = 0.5
	#Combat data of rebuilt humans: extra damage per beaten foe of the same kind. 0 = off.
	#Range: 0.0 ~ 0.1
	combatDataPerFoe = 0.002
	#Combat data: highest extra damage against one kind of foe (0.10 = +10%).
	#Range: 0.0 ~ 1.0
	combatDataCap = 0.1
	#Duu's mimicry: blocks within which a transformed fighter must be seen when it starts.
	#Range: 4.0 ~ 128.0
	mimicryRange = 24.0
	#Seconds Duu's mimicry lasts. 0 = until DragonMineZ ends it.
	#Range: 0 ~ 3600
	mimicrySeconds = 30
	#Seconds the overclock core runs before it overheats. 0 = until DragonMineZ ends it.
	#Range: 0 ~ 3600
	overclockSeconds = 45
	#Seconds of exhaustion (slowness, weakness) after mimicry or overclock ran out. 0 = none.
	#Range: 0 ~ 600
	aftermathSeconds = 20

