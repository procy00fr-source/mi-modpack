
#The masters' signature techniques. Damage, ki cost, cooldown and price stay DragonMineZ' (skills.json, techniques.json).
[signatures]
	#Guided Kamehameha: degrees per tick the firing wave turns after the caster's look. 0 = it fires straight like any wave (DragonMineZ' mouth blast turns 6).
	#Range: 0.0 ~ 20.0
	guidedSteerDegrees = 3.0
	#Death Saucer: blocks ahead in which the disk picks a foe by itself when nothing is locked on. 0 = only DragonMineZ' lock-on homing.
	#Range: 0.0 ~ 30.0
	saucerSeekRange = 24.0
	#Death Saucer: degrees off the caster's look a foe may be to be picked.
	#Range: 1.0 ~ 60.0
	saucerSeekDegrees = 20.0
	#Big Bang Kamehameha: size of the halo of light behind the caster as he draws it (DragonMineZ' explosion picture). 0 = no halo.
	#Range: 0.0 ~ 8.0
	bigBangHaloSize = 2.5

