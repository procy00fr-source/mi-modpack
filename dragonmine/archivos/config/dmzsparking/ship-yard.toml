
#Ships players buy at Vegeta's harbour technician or craft (Bardock's, the CC ship, the GT ship, Frieza's, King Cold's, the transporter).
[shipYard]
	#true = the harbour technician sells ship orders (each ship still needs its saga point). false = none is sold.
	sell = true
	#true = ship orders can be crafted (recipe shown after the saga point). false = no ship recipe. Takes effect at the next start or /reload.
	craft = true
	#Most of these ships one player may own at once, packed or parked (ships). 0 = no limit. The Cube does not count.
	#Range: 0 ~ 64
	maxShipsPerPlayer = 0

	[shipYard.bardock_leek]
		#true = this ship is sold at the harbour. false = not sold.
		sell = true
		#true = this ship's order can be crafted. false = no recipe.
		craft = true
		#Price at the stall in emeralds, paid as emerald blocks and emeralds (emeralds). -1 = the stall's own list.
		#Range: -1 ~ 584
		price = -1
		#Players flying along on their feet beside the seats, standing where they stood at take-off (players). 0 = seats only.
		#Range: 0 ~ 64
		standing = 0

	[shipYard.cc_namek]
		#true = this ship is sold at the harbour. false = not sold.
