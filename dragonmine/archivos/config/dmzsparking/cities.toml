
#City life.
[cities]
	#Residents per building. 0 = empty cities.
	#Range: 0.0 ~ 2.0
	residentsPerBuilding = 0.5
	#Driverless cars on the city streets (up to 24 driving and 12 parked per city). Off by default: they cost frame rate.
	traffic = false
	#Cars in percent of the default, when traffic is on. 0 = no traffic.
	#Range: 0 ~ 300
	trafficPercent = 100
	#Milliseconds per server tick, on average, for building a city out ahead of the players. Lower = smoother server, cities take longer.
	#Range: 1 ~ 40
	buildMillisPerTick = 5

