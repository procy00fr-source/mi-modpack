
#Course flight between star systems.
[courseFlight]
	#Seconds for a whole course at full thrust.
	#Range: 5 ~ 3600
	thrustSeconds = 60
	#Seconds for a whole course on autopilot.
	#Range: 5 ~ 3600
	autopilotSeconds = 120

#Ship speed as a multiple of the pod's (1 = as fast).
[shipPace]
	#Bardock's round ship and the transporter.
	#Range: 0.5 ~ 3.0
	smallShip = 1.1
	#Capsule Corp. ships (the CC ship, the GT ship) and the Cube.
	#Range: 0.5 ~ 3.0
	capsuleCorp = 1.2
	#King Cold's ship.
	#Range: 0.5 ~ 3.0
	kingCold = 1.3
	#Frieza's ships.
	#Range: 0.5 ~ 3.0
	frieza = 1.5

#Ship flight with a crew aboard.
[shipFlight]
	#Top speed in blocks per tick while anyone aboard is standing or walking.
	#Range: 0.2 ~ 8.5
	walkingSpeed = 2.0

