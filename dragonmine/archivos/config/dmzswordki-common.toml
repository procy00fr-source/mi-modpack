
[general]
	#Permite bloquear y lanzar tecnicas de ki de DragonMine Z con un item (espada, etc.) en la mano.
	#Debe estar instalado en el servidor Y en los clientes.
	allowBlockAndKiWithItems = true
	#Permite usar supergolpes de puños y evasiones con un item en la mano (se aplica en el servidor).
	#Los golpes de espada (Brave Sword y golpe dimensional) no se tocan.
	allowStrikeAndEvasionWithItems = true
	#Permite bloquear mientras el arma de ki (Ki Manipulation) esta activa.
	allowBlockWithKiWeapon = true
	#No inicia el bloqueo de DMZ cuando estas usando un item (comiendo, bebiendo...) o llevas en la mano
	#comida, pociones, bloques u otro item que se usa con clic derecho (arco, escudo...).
	#Asi el clic derecho sirve para comer, beber y colocar bloques sin que salga la animacion de bloqueo.
	#El ki, la evasion y los supergolpes siguen funcionando con esos items.
	skipBlockWhenUsingItems = true

[visual]
	#Oculta el item de la mano (primera y tercera persona) mientras se carga o dispara una tecnica de ki.
	hideItemWhenCastingKi = true
	#Oculta el item de la mano mientras se hace un supergolpe de puños o una evasion.
	#Los golpes de espada nunca ocultan la espada.
	hideItemWhenStrikeOrEvasion = true
	#Oculta tambien el item de la mano mientras se bloquea.
	hideItemWhileBlocking = false
	#Ticks (20 = 1 segundo) que el item sigue oculto despues de terminar, para que no parpadee.
	#Range: 0 ~ 100
	hideGraceTicks = 10

