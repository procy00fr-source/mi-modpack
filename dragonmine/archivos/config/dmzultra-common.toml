	#Off: the form stays installed and is held with a reason.
	majinAndroid = true
	#While a Human wears Majin-Android they have the Majin's Elastic Body: knockback x0.6 and no fall damage.
	elasticBody = true
	#The Gamma Frame purchase waits for Dr. Gero's protocol quest and Majin-Android for the Candy and Circuits quest.
	#Off: both are open to any android (the other rules - Human, active Android body, Android forms level 1 - still hold).
	questsRequired = true

#Bio-Androids (W2-EXTRAS-BIO): bio-data by quest, Cell Max and the strains of every race.
[extrasbio]
	#Cell sells Frieza's and Piccolo's bio-data (friezabiodata, piccolobiodata) only to a Bio-Android who has finished the
	#side quest 'Frieza's Cells' / 'Piccolo's Cells' (one each). Both are bought with TP, never with a wish. A Bio-Android who already
	#owns a bio-data keeps it. Off: Cell sells both as in 0.4.0, no quest asked.
	biodataQuests = true
	#A Bio-Android takes genome strains from Angels, Glinds and Androids too (the saga androids, players who are Human
	#androids), each with its own look. Off: the three groups stay installed and priced -1, and nothing gives their strains; the
	#strains already held keep working.
	newStrains = true

#The three transformation scene families of the new lines (W2-SCENES). Each form of those lines plays a scene of
#its family (long and opt-in as every scene, short in the world, one press); off: its forms keep the scene they had before.
#A dedicated server and its players should keep the same values (the server keys its timing to the family).
[scenefamilies]
	#Corruption: every evil line - veins crawling, black smoke, the scream, the burst in the form's colours.
	corruption = true
	#Rage awakening: the mutant lines (not the Saiyan's Legendary) - the meter at its peak, shards, the roar.
	rageAwakening = true
	#Race awakening: the Sekhari sun, the Seiun-jin supernova, the Makaijin pit, the Angel's halo breaking free.
	raceAwakening = true

#Time Skip v2 (Taimu-jin): earned levels, no chaining, bosses only slowed, a 2 s cap on players, and the
#Taimu-jin passives Pure Progress and Time Sense.
[timeskip]
	#Time Skip levels: five TP levels set the skip's base (forms add at most formBonusCap of it).
	#Off: the form alone sets the skip, as in 0.4.0 (the caps, the chain immunity and the boss rule below still hold).
	v2 = true
	#TP price of each level (level 1 is given free to every Taimu-jin; -1 = that level is not sold).
	#Written into config/dragonminez/skills.json at every server start.
	levelPrices = [0, 400000, 1200000, 3000000, 7000000]
	#Share of the level's base duration and reach the strongest form may add (0-1).
	#Range: 0.0 ~ 1.0
	formBonusCap = 0.5
	#Longest a player is held (stopped or slowed) by one skip, in ticks. Never more than 40 (2 s).
	#Range: 10 ~ 40
	pvpCapTicks = 40
	#After a skip lets go of anything (its end, the cap, a break-out), no Time Skip can catch it again for this long.
	#Range: 20 ~ 200
	chainImmunityTicks = 80
	#Bosses (entity tag #dmzultra:skip_resistant, world bosses, anything taller than 2.5 blocks):
	#"slow" = never stopped, slowed to at least 60 % of their pace; "immune" = untouched.
	bosses = "slow"
	#No skip while the Taimu-jin is held (hit-stun, juggled, knocked down), caught in a skip, in a transformation
	#scene or in the God Ritual.
	hitstunRule = true
	#A player who was guarding when stopped keeps the guard up the whole stop (blows land as blocked, half poise damage).
	guardKept = true
	#Taimu-jin passive Pure Progress: the same attack landing a third time within 8 s is softened by 30 %, and the
	#fourth is dodged (once per 20 s).
	pureProgress = true
	#Taimu-jin passive Time Sense: a Taimu-jin always senses stopped time as if with Time Perception level 1
	#(never stopped by another Taimu-jin, only slowed) and sees a skip's warning ring 4 ticks earlier.
	timeSense = true
	#Warning ring: a skip lands telegraphTicks after the key press; a clock ring shows on the ground and players around
	#see the screen edge pulse, so a dash out of the ring escapes it. A blow that staggers the Taimu-jin in the windup cancels the skip.
	#Off: the skip lands on the press, as in 0.4.0.
	telegraph = true
	#Ticks between the key press and the skip landing (the warning ring's length).
	#Range: 4 ~ 20
	telegraphTicks = 8
	#Break out: a stopped player who presses the guard key breaks free at once, for breakKiCost of their max ki
	#(half with Time Perception 3 or more), and cannot be caught again for chainImmunityTicks.
	breakOut = true
	#Share of max ki a break-out costs.
	#Range: 0.1 ~ 0.9
	breakKiCost = 0.35

#Time Skip counterplay (W3-TIMESKIP-COUNTER, built by RACE-AP-3). The warning ring, the break-out and the kept guard
#are in [timeskip].
[timeskipcounter]
	#Shake Free: a fighter who is not stopped sneak-strikes a stopped ally (party, team) to jolt them out of a
	#Time Skip - no damage, the ally is free at once and cannot be caught again for timeskip.chainImmunityTicks.
	shakeFree = true
	#Share of the striker's max ki Shake Free costs (half with Time Perception 2 or more).
	#Range: 0.05 ~ 0.9
	shakeKiCost = 0.2
	#Counter-Time: with Time Perception 4 or more, a slowed fighter's melee blow on the Taimu-jin whose skip holds
	#them shatters the whole skip (everyone is let go at once).
	counterTime = true

#The Angel race: Angelic Instinct (the one passive dodge), Angel's Grace, the race offer at the end of the Angel Path,
#Attendant's Duty and the Angel lane on the Angel Path (docs/angel_rework/SPEC.md 3.4).
[angelrace]
	#Angel is earned on the Angel Path: hidden in the character creator, and a creation packet naming it is refused.
	#Off: Angel can be picked at creation again.
	pathOnly = true
	#The angel teacher offers the race change at the end of the Angel Path. Off: no offer ('/dmzultra angel ascend' still works).
	ascension = true
	#The Angel Path row that opens the offer: 7 = Divine Attendant (the last stage), 8 Instructor, 9 Guardian,
	#10 Emissary of the Grand Priest.
	#Range: 7 ~ 10
	ascensionStage = 7
	#Angelic Instinct: an Angel's body dodges on its own (one roll per blow). Off: no passive dodge, DragonMineZ'
	#Meditation dodge works for Angels as for anyone, and Angel's Grace rolls the instinct only while its window is open.
	instinct = true
	#The base chance against non-players at Instinct level 10: 0.85 keeps the table as shipped (75 % at
	#Lv 1 to 85 % at Lv 10); a lower or higher value scales the whole table and the forms' caps with it (never above 95 %).
	#Range: 0.0 ~ 0.95
	instinctPveCap = 0.85
	#The chance against a player is this share of the chance against a creature. 1.0 (default): the same
	#against a player, as the Ultra Instinct family; 0.70 would turn 85 % into 59 %.
	#Range: 0.0 ~ 1.0
	instinctPvpRatio = 1.0
	#The base gap after each instinct dodge, in ticks (forms shorten it).
	#Range: 1 ~ 600
	instinctGapTicks = 30
	#The share of max stamina each instinct dodge costs, in percent.
	#Range: 0.0 ~ 50.0
	instinctStaminaPercent = 1.5
	#Instinct against instinct: an attacker who is an Angel in a god form, or wears Mastered or True Ultra
	#Instinct, takes 15 points off the defender's chance (never below 10 %).
	instinctVsInstinct = true
	#A wish on the Super Dragon Balls ('Return me to the race I was born as') undoes the change to Angel.
	superWishUndo = false
	#Attendant's Duty (Angel passive): DragonMineZ' Ki Transfer from an Angel delivers 5 % more ki and leaves
	#the Angel half the exhaustion.
	attendantsDuty = true
	#Race Angels walk the Angel Path faster: Whis's drills have a third fewer waves and foes (non-Angels walk it
	#as before).
	pathLane = true
	#Whether an Angel may wear the Ultra Instinct stack. On (default): it may, like every race. Angelic
	#Instinct stays its one roll per blow, at the higher of its own chance and the stack form's (True 75 %, Mastered 100 % with no
	#pause between dodges - ultra_divine.instinct).
	#Off: owned but not worn - the instinct is the Angel's own.
	angelsWearUltraInstinct = true

#The Angel's techniques (W3-ANGEL-ARTS): staff strikes, the Angel Barrier and the rewind of the last hit.
[angelarts]
	#Staff strikes: with a working Angel Staff in the main hand a melee string of three hits and a launcher.
	#The first two hits are plain, the third is a finisher that drives the foe back, the fourth (if you keep striking) lifts it.
	strikes = true
	#Ticks between two blows of the staff string before it starts over.
	#Range: 8 ~ 80
	strikeWindowTicks = 26
	#Ticks before the launcher can lift a foe again (so nobody is juggled for ever).
	#Range: 40 ~ 600
	launcherCooldownTicks = 100
	#The Angel Barrier: a ki shield technique only Angels learn, sold by Whis (off: nobody can use it).
	barrier = true
	#TP price of the Angel Barrier at Whis (-1 = not sold).
	#Range: -1 ~ 100000000
	barrierPrice = 12000
	#The rewind of the last hit: an Angel who has just been hurt can press sneak + the racial key to take that one hit back,
	#once per fight.
	rewind = true
	#Ticks after a hit during which it can still be rewound (a newer hit replaces it).
	#Range: 20 ~ 200
	rewindWindowTicks = 100
	#A fight is over after this many ticks without a hit given or taken; the rewind is ready again then.
	#Range: 100 ~ 1200
	fightEndsAfterTicks = 400
	#Share of the Angel's maximum ki the rewind costs, in percent.
	#Range: 0 ~ 60
	rewindKiPercent = 12
	#The most health a rewind gives back, in percent of the maximum.
	#Range: 5 ~ 100
	rewindMaxPercent = 50

#Race actives and passives, Frost Demon and Bio-Android (RACE-AP-2). Each switch off: the key does nothing and the
#passive is gone (the parts stay listed).
[racehooks2]
	#Frost Demon: Telekinetic Hold on the racial key (lift what you look at within 16 blocks; the key again throws it).
	frostDemon = true
	#Bio-Android: Genome Burst on the racial key (borrow a held strain race's passive for 10 s; sneak + key cycles
	#the strain).
	bioAndroid = true
	#Frost Demon passive: Void-Hardened - the heat of stars does not hurt a Frost Demon.
	voidHardened = true
	#Bio-Android passive: Adaptive Cells - the same ki technique twice within 20 s is taken at x0.8 for 20 s.
	adaptiveCells = true
	#Ticks Telekinetic Hold keeps a player (mobs are always held 30 ticks); then 60 ticks they cannot be held again.
	#Range: 5 ~ 30
	pvpHoldCapTicks = 15

#Race actives and passives: Saiyan, Human, Namekian.
[racehooksa]
	#Zenkai Surge builds on DragonMineZ 2.2's Zenkai: every full Zenkai a Saiyan has earned adds 2% to the Surge's
	#damage boost (up to 10%), and Fury fills at half speed while 2.2's rage meter is running, so one hit never fills two meters.
	#Off = the old Surge (the stronger Surge after surviving under 5% health).
	zenkaiBoost = true
	#Second Wind (Saiyan): once per fight, when stamina falls under 10% while health is above 25%, stamina refills to
	#60% and stamina comes back 50% faster for 3 seconds.
	secondWind = true
	#Ticks without a blow dealt or taken that end a fight (Second Wind is ready again after it).
	#Range: 100 ~ 2400
	secondWindFightEnds = 400
	#Kiai Burst (Human, racial key): a short inhale, then a spirit shout in a 90 degree cone, 6 blocks: interrupts ki charges
	#and pushes back 3 blocks, no damage (360 degrees and 5 blocks when Adrenaline is armed). 8% ki, 18 s cooldown.
	kiaiBurst = true
	#Martial Discipline (Human): dashes cost 25% less ki and a guarded blow does 20% less poise damage.
	martialDiscipline = true
	#Stretch Grasp (Namekian, racial key): the arm reaches up to 14 blocks: a creature is pulled 60% of the way in
	#(a boss pulls you to it instead), a block pulls you to it. 6% ki on a hit, 10 s cooldown.
	stretchGrasp = true
	#Keen Hearing (Namekian): a blow from out of view (more than 100 degrees off where you look) shows where it came
	#from, and the first such blow every 20 s deals 25% less.
	keenHearing = true

#Race actives and passives, Majin and Glind (RACE-AP-3). Each switch off: the key does nothing and the passive is
#gone (the parts stay listed).
[racehooks3]
	#Majin: Body Split on the racial key - a double of you pops off for 6 s; creatures after you go after it, and
	#the first blow bursts it into goo that slows enemies 30 % for 2 s. 10 % ki, 20 s rest.
	majin = true
	#Majin passive: Elastic Body - knockback taken x0.6 and no fall damage.
	elasticBody = true
	#Glind: Twilight Verdict on the racial key - an 8-block pulse that follows your alignment (evil: Divine
	#Punishment doubled for 6 s; good: allies heal 8 % and enemies are pushed 4 blocks; neutral: both at half). 12 % ki, 30 s rest.
	glind = true

#Prices of DMZ Ultra's new form lines (prices.json, made on DragonMineZ 2.2's price curve).
[racePrices]
	#Whether the new form lines (mutant, evil and extra lines) are sold at the prices of DragonMineZ 2.2's curve
	#(dmzultra/extra/races/prices.json). Takes effect at the next start. A price you edited yourself is kept while
	#prices.keepEditedPrices is on.
	#true - fair curve prices (default).    false - the prices the line's manifest wrote.
	fairCurve = true

#Hakai (the God of Destruction's technique; lane DST-2): a sphere, a beam and a grab. Rank and energy come from the
#Destroyer Path (an appointed Destroyer; config/dmzultra/destroyer.json path.hakaiEnergyCost).
[hakai]
	#Master switch. Off: no Hakai can be cast by anybody (the techniques stay registered).
	enabled = true
	#The Hakai sphere: a slow, homing sphere of erasure.
	orb = true
	#The Hakai beam: a thin violet beam.
	beam = true
	#The erasure grab: held at arm's length for a moment, then erased.
	grab = true
	#The sphere turns towards the foe the caster faces (DragonMineZ' own steering).
	homing = true
	#How far the sphere looks for a foe, in blocks.
	#Range: 8 ~ 128
	homingRange = 40
	#A Hakai that lands on a creature that is not a boss or a player kills it outright (erasure). Off: it hurts like any ki.
	erase = true
	#Whatever Hakai erases leaves no drops and no experience (a player's own items are never taken: a player dies as usual).
	noDrops = true
	#The sphere and the beam may take blocks, as every ki attack does where DragonMineZ' ki-griefing rule allows
	#(never in the worlds whose ground ki cannot break). Off: they never do.
	erodeBlocks = true
	#In the Trial of Measure a candidate may loose Hakai at no energy (only while destroyerOnly is off: an appointed
	#Destroyer has passed every trial).
	freeInMeasure = true
	#An operator in creative mode may cast Hakai without rank or energy (for testing and for server events).
	opsMayCast = true
	#The three Hakai techniques are put in the Destroyer's hands at the appointment (the apprentice's too while
	#destroyerOnly is off), and at login for whoever holds the rank and lacks them.
	giveOnApprenticeship = true
	#The grab holds this long before it erases, in ticks.
	#Range: 5 ~ 60
	grabHoldTicks = 15
	#How far the grab reaches, in blocks.
	#Range: 2.0 ~ 8.0
	grabReach = 4.5
	#The most a grab does to a player: this share of their maximum health (a player is never erased outright).
	#Range: 5 ~ 90
	grabPlayerCapPercent = 60
	#The most a grab does to a boss: this share of their maximum health.
	#Range: 1 ~ 90
	grabBossPercent = 20
	#A blow on the caster worth this share of their maximum health breaks the grab.
	#Range: 1 ~ 100
	grabBreakPercent = 15
	#A Hakai of a God of Destruction who is a Kai's partner raises the Kai's Divine Bond (+2, three a day).
	kaiBond = true
	#Only an appointed God of Destruction may cast Hakai: candidates and apprentices may not, the techniques are never
	#sold, and whoever holds them without the seat has them taken back (an operator in creative mode testing excepted). Off: an
	#apprentice casts Hakai too, as before 0.4.
	destroyerOnly = true
	#A God of Destruction's Hakai sphere or beam that reaches a world in space erases it, whatever its power (the world's
	#own protections still hold: home and story worlds, sanctuaries, a player standing on it, claimed land). Off: Hakai never ends a world.
	planetErasure = true
	#Hakai as the anime shows it, drawn on the clients (client/hakai/HakaiCinema): the sphere forming over the hand,
	#the crackling sphere in flight, a violet envelope that traces the held or struck creature's shape, the body coming apart from its
	#edges inwards into rising motes over about two seconds, nothing left; a world erased by Hakai dissolves in violet light instead of
	#exploding. Off: the older look (server particles, the motes rising for a second). What Hakai does is the same either way.
	cinematicErasure = true

#The Destroyer Path's audience, discipline and uniform (lane DST-3). The path itself, its trials and the discipline's own
#master switch are in config/dmzultra/destroyer.json (path.*, discipline.*).
[destroyer_ultra]

	[destroyer_ultra.audience]
		#The Zenos' audience in the world: the Grand Priest and Zeno come to stand before an appointed God of Destruction and
		#before a hearing. Off: the appointment is the plain title and lines of the path, and a hearing is a line of chat.
		enabled = true
		#The Grand Priest and Zeno are seen in the world (two figures that stand a few seconds beside the player and are taken
		#away again; never saved). Off: the audience is its plates and titles only.
		attendants = true
		#The server may tell a player's client to play the staged (camera) version of the audience. Whether it is played is the
		#player's own opt-in (client option destroyer_ultra.stagedAudience, off).
		stagedCue = true

	[destroyer_ultra.discipline]
		#A Hakai grab on a player who is not in a spar or a duel earns a strike.
		hakaiOnPlayers = true
		#Erasing a liberated world outside a sanctioned trial earns a strike.
		worlds = true
		#A Hakai grab on a Kai or on an angel earns a strike.
		kaiAngel = true
		#How long the Grand Priest stands beside a player he warns, in seconds.
		#Range: 2 ~ 30
		warningSeconds = 6
		#The strike that calls a hearing before the Zenos (1 = every strike is a hearing; the first below it is a warning).
		#Range: 1 ~ 5
		strikesForHearing = 2

	[destroyer_ultra.uniform]
		#The Destroyer uniform is shared with the players who can see the wearer. Off: nobody is told who wears it (the unlock
		#and the colour are still kept).
		enabled = true

	[destroyer_ultra.admin]
		#The operators' command /dmzultra destroyer (report, set, energy, seat free, strikes clear, reset).
		enabled = true

[sense]
	#Ki Sense scan and track: in DragonMineZ' Ki Sense SEARCH mode the server answers a long-range scan (players and saga
	#fighters of the same dimension, beyond what the client has loaded) and lets a fighter track one signature. 2.2's rules hold:
	#0 % Power Release, the anti-ki cloak and an upgraded Android hide a fighter; a god form is hidden from those without God Ki;
	#Glind divine ki is hidden as DragonMineZ hides it. false: nothing is answered and DragonMineZ' own Ki Sense is unchanged.
	enabled = true
	#Scan range in blocks at Ki Sense level 1, before rangePerLevel.
	#Range: 32 ~ 16384
	baseRange = 256
	#Blocks added per Ki Sense level above the first.
	#Range: 0 ~ 4096
	rangePerLevel = 128
	#The scan range never goes above this (blocks).
	#Range: 32 ~ 30000
	maxRange = 2048
	#How many signatures a character remembers (the most recent ones; the Kai path reads them).
	#Range: 1 ~ 64
	memorySize = 16
	#At most this many signatures in one scan answer (players first, then the strongest).
	#Range: 1 ~ 64
	maxSignatures = 24

#The living multiverse's foundation (LIV-0): one pulse clock, per-character records, the news feed, the hub.
#Every later living system (colony war, encounters, bounties, stations ...) has its own section and switch.
[living]
	#Master switch of every living system. Off: no pulse runs, no system starts anything new, the hub says it is off.
	#Starting value for new worlds; existing worlds: /dmzultra world rules (or Utilities > World).
	enabled = true
	#Ticks between two pulses of the simulation (400 = 20 s, three a minute).
	#Range: 100 ~ 2400
	pulseTicks = 400
	#Server-thread time one pulse may take, in microseconds; what is left over runs at the next pulse (round-robin).
	#Range: 200 ~ 20000
	pulseBudgetMicros = 2000
	#After the world opens, pulses run quickly (two a second) to cover the time the server was off - at most this many (0 = none).
	#Range: 0 ~ 600
	catchUpPulses = 90
	#News items kept per universe (the oldest drop off).
	#Range: 8 ~ 256
	newsPerUniverse = 64
	#Requests per second a player may send to a living system (token bucket; a burst of twice this).
	#Range: 1 ~ 40
	c2sPerSecond = 8
	#Living-system fighters and props alive around one player at most (war squads, ambushes, companions ...).
	#Range: 0 ~ 200
	maxEntitiesPerPlayer = 24
	#Living-system fighters and props alive on the whole server at most.
	#Range: 0 ~ 5000
	maxEntitiesServer = 300
	#The Living Multiverse screen (key 'Living Multiverse', unbound by default, or /dmzultra living hub): the news of every
	#universe and, as they arrive, the tabs of the living systems.
	hub = true
	#At login, a card 'While you trained...' with the news of your universe since that character was last seen.
	loginDigest = true
	#A saga villain defeated by a player is reported in the news of that universe (one item per villain and universe a day).
	sagaDefeatNews = true

#World events of the afterlife and the Demon Realm (lane WEV-1): Gomah's army in the Demon Realm, an ogre riot in Other World,
#villains breaking out of Hell. They use the same machinery, power rule and rewards as the events of Earth (see [worldEvents]),
