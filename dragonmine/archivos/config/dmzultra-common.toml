	#Characters every player has without paying.
	#Range: 1 ~ 8
	freeSlots = 3
	#The most characters a player can ever have (free + bought + wished + granted).
	#Range: 1 ~ 8
	maxSlots = 8
	#TP price of each extra slot past the free ones, in order (the last price repeats).
	extraSlotTpCosts = [1000000, 2500000, 5000000, 10000000, 20000000]
	#Extra slots can be bought with Zeni by the character being played (never TP).
	tpUnlock = true
	#Shenron and Porunga offer "A new life": a Character Capsule, which unlocks one more slot when used.
	wishEnabled = true
	#No switch for this many seconds after dealing or taking damage.
	#Range: 0 ~ 600
	combatLockSeconds = 15
	#A deleted character can be restored for this many days, then it is gone for good.
	#Range: 1 ~ 365
	deleteRestoreDays = 7
	#Other mods' player data (their capabilities) moves with the character too. Off: it stays with the player.
	otherModData = true
	#Capability ids that never move with a character (a mod whose data keeps live references).
	capabilityDenylist = []
	#No switch while the character holds a unique seat that is still kept per player rather than per character (a Kai seat).
	#Off: the seat follows the player into every character until that seat system keeps its holders per character.
	holderGuard = true
	#While DMZ Character Slots (mod id dmzcharacterslots) is installed, DMZ Ultra's character slots stand aside (true, default): no
	#character screen, no switching, no slot commands, nothing written - only one mod ever swaps a player's data. Characters parked
	#earlier stay on disk untouched. false: both mods may swap characters (not advised). Without that mod this changes nothing.
	standAsideForCharacterSlots = true

#Realistic mode (DMZ Ultra's own): forms on the story scale (Super Saiyan many times base, gods far beyond), slower TP, DMZ Ultra's
#lines priced like forms of their strength, saga foes that last longer and hit harder, a TP milestone per saga. Off in every world
#until it is turned on there: the world rule realism.enabled (Saga Setup, Edit World, Utilities > World, V > OPTIONS > Game >
#World rules, or /dmzultra realistic progression on). Ki costs and drains are not scaled. The forms' numbers are DMZ Ultra's
#realistic table; a server owner tunes them in config/dmzultra/realism_forms.json.
#Since 0.6 this section also holds the two form keys of the old [realistic] section (read once from an older file and moved here).
[realism]
	#Realistic mode can be switched on in a world (true, default). False: it is not available at all.
	enabled = true
	#TP gained in realistic mode, in percent of the normal gain (our own fixed-figure rewards keep their figure).
	#Range: 1.0 ~ 1000.0
	tpPercent = 50.0
	#Saga foes' realistic health factor, in percent of the curve's (100 = as tuned).
	#Range: 1.0 ~ 1000.0
	foeHealthPercent = 100.0
	#Saga foes' realistic damage factor, in percent of the curve's (100 = as tuned).
	#Range: 1.0 ~ 1000.0
	foeDamagePercent = 100.0
	#Each of DMZ Ultra's sagas pays one realistic TP milestone, once per character.
	milestones = true
	#Whether forms join the realistic scale (was realistic.dmzUltraForms).
	#true  - in realistic mode every form gets a story-scale multiplier (Super Saiyan x50,
	#        Super Saiyan God x1600 ... on DragonMineZ' own scale), stack forms multiply the form
	#        they are worn over, and DMZ Ultra's form skills are priced like forms of the same
	#        strength (default). Those are story values, not always what is applied: DMZ Overhaul's
	#        scale, dmzUltraFormScale below and config/dmzultra/realism_forms.json change them.
	#        The Forms page of the V menu shows yours.
	#false - forms keep their normal multipliers and prices even in realistic mode.
	dmzUltraForms = true
	#Scales every form's realistic multiplier (1.0 = as designed; was realistic.dmzUltraFormScale).
	#Range: 0.1 ~ 10.0
	dmzUltraFormScale = 1.0

