#DMZ Ultra's quality-of-life systems: Majin absorption, Super Shenron's access wishes and Majin-Android.
#Until 0.6 this section was [noeaQol]; an older file is carried over with its values.
[ultraQol]

	#Majin absorption on top of DragonMineZ' own racial (the key, the charge and the slots stay DragonMineZ').
	[ultraQol.absorb]
		#Our absorption rules: a weakened target, protected gods, the player consent rule, sparing consenting players.
		#false - DragonMineZ' own rules only (the absorber must be stronger; players can always be taken and die).
		rules = true
		#A target must be at or below this share of its health to be absorbed (Super Buu takes fighters he has beaten).
		#1.0 turns the rule off. Creative players are never held back.
		#Range: 0.05 ~ 1.0
		weakenedLimit = 0.35
		#Androids and Bio-Androids (machines and Cell's line) cannot be absorbed.
		protectSynthetic = true
		#Who among players a Majin may absorb:
		#never   - no player.
		#consent - only a player who allowed it (/dmzultra absorbed consent ...). Default.
		#pvp     - any player the server's PvP lets you hurt (DragonMineZ' own rule).
		players = "consent"
		#A player absorbed with consent is held, not killed: they keep their life and items, are left drained for half a
		#minute, and can break out (/dmzultra absorbed breakout), which frees their slot. false - they die, as DragonMineZ has it.
		spareConsenting = true
		#Whether a Majin keeps its absorptions when it dies. DragonMineZ 2.2 loses them all on death (false, default).
		keepOnDeath = false
		#Share of each absorption's stat bonus a Majin keeps for good, even after it is ejected or lost on death
		#(the absorbed fighter's essence). Counted once per fighter: the same fighter (one player, or one kind of enemy) only ever
		#keeps its best absorption. 0 turns it off.
		#Range: 0.0 ~ 0.5
		lastingShare = 0.1
		#The lasting essence of all fighters together is capped at this share of the Majin's own base stat.
		#Range: 0.0 ~ 2.0
		lastingCap = 0.25
		#While a Majin wears an absorbed fighter's look it also carries that fighter's race trait (Namekian regeneration,
		#Saiyan battle surge, Frost Demon hide, Bio-Android ki, Human focus, Majin elastic body).
		traits = true

	#Super Shenron's access wishes (one wish per summon; the dragon rests per universe after a wish: [space] superBalls.restMinutes).
	[ultraQol.wishes]
		#Adds the three access wishes (Buu's DNA, Android Completion, Bio-Data) to Super Shenron's list (Eternal Life is one of his
		#own wishes since the Super Shenron build; Master the Line became his Perfect Mastery).
		enabled = true
		#Eternal Life saves its holder from a killing blow (1 HP and 3 s of grace), then needs this long to come back (seconds).
		#Range: 10 ~ 86400
		eternalLifeRecoverySeconds = 120
		#The access wishes: each meets its line's requirement the way its quest does (Buu's DNA: Majin-Android; Android
		#Completion: the Gamma line; Bio-Data: Frieza's and Piccolo's bio-data). In the 0.5 progression the line is then bought with TP; in
		#the RPG mode the wish counts as one requirement of the line's route.
		accessWishes = true

	#Majin-Android (the Human form human/gammaframeforms/majincircuit).
	[ultraQol.majinAndroid]
		#Buu's DNA is unstable: below the mastery set here, a Majin-Android now and then loses control for a few seconds
		#and lunges at the nearest foe (never at party members or allies, never at players while PvP is off).
		instability = true
		#Mastery of Majin-Android at and above which the form is stable.
		#Range: 0.0 ~ 100.0
		stableMastery = 70.0

#DMZ Ultra's Sphinxian and Demon races.
#Until 0.6 this section was [noearaces]; an older file is carried over with its values.
[ultraraces]
	#Predator's Poise (Sphinxian): 6 s without taking damage readies a pounce - the next melee hit on a hostile deals
	#20% more and gives back 5% of your stamina.
	predatorsPoise = true
	#Pounce on the racial key (Sphinxian): a low leap at the fighter you look at, 12% stamina, 8 s cooldown.
	pounce = true
	#Soul Levy (Demon): a hit that leaves a hostile at 35% health or less spends 8% of your ki to take back 6% of
	#the damage as health and ki (at most 6% of each), once every 30 s.
	soulLevy = true
	#The Evil Third Eye (Demon): stores power from damage taken; the racial key spends 1000 to grow (x2, x4, x8),
	#sneak + key powers down; the third form overloads at 1000 and tears the Eye out after 60 s.
	evilEye = true
	#A Demon's Potara fusion does not wear off by time; it ends through the "separate the bond" wish.
	demonBond = true
	#The Demon wishes on the dragons: an Evil Third Eye, separating a Demon's bond, and the Glind body exchange.
	wishes = true
	#The dragons that grant them.
	wishDragons = ["shenron", "porunga", "super_shenron"]
	#The Glind body exchange: a Demon wishes for a Saiyan's body (a consenting Saiyan's, else a new one).
	bodyExchange = true
	#How long a Saiyan's consent to the exchange lasts, in seconds.
	#Range: 30 ~ 3600
	consentSeconds = 300
	#A character that left the Sphinxian or Demon race in 0.4's conversion gets one free, optional re-pick now that
	#the race is back (nobody is moved back automatically).
	returnRepick = true
	#Our Demon replaces DragonMineZ' Glind (owner, 2026-10-31): while on (and the Demon race is on), Glind is not offered
	#in the character creator or the race change, Demon takes its place in the race bar, and each Glind character becomes a Demon
	#once at login (owned forms moved tier by tier, TP refunded for any form without a counterpart, one free optional re-pick).
	#Off: DragonMineZ' Glind is offered again as DragonMineZ ships it; nobody is converted (characters already moved stay Demons).
	replaceGlind = true

	#The race folders. Off: the folder is not written (an existing folder is left alone, its players keep the race).
	[ultraraces.races]
		#Sphinxian.
		sphinxian = true
		#Demon (DMZ Ultra's own Demon; DragonMineZ' own Glind is a different race).
		demon = true

[saga_hit]
	#Blue Kaioken (Kaioken worn over Super Saiyan Blue or Blue Evolved) waits for the end of Hit's Contract
	#(after the Goku Black Saga). Kaioken and Super Saiyan Blue are each bought and worn as before; only wearing them together waits.
	#Never held back while the story lock or DragonMineZ' story mode is off, nor for operators in creative.
	#true - it waits for the saga (default).    false - wear them together whenever.
	blueKaiokenGate = true
	#Time Skip's Phase Shift, earned at the end of Hit's Contract: while a Taimu-jin's own Time Skip runs, the first
	#blow aimed at them passes through (Hit's separate dimension). Once per skip.
	phaseShift = true
	#Whether the saga's two duels with Hit start by themselves when they are the current quest objective
	#(a warning, then the fight five seconds later where the player stands).
	#true - fight Hit (default).    false - the duels are skipped and their quests move on by themselves.
	storyFights = true

#Dragon Ball Super: Super Hero, the canon saga after Granolah the Survivor (lane SAGA-SUPERHERO).
[saga_super_hero]
	#Whether the saga's fight steps (Gamma 2, the two Gammas, the Cell Max raid) are offered and counted. The objective type stays
	#registered either way, so the quests still load; switched off, those steps simply wait.
	#true - the fights run (default).    false - fight steps wait.
	fights = true
	#Whether a Gamma fight starts by itself 10 seconds after its step begins (where the player stands, when they are free). The
	#chat prompt and /dmzultra superhero fight start it at once either way. The Cell Max raid never starts by itself.
	#true - it starts by itself (default).    false - only the prompt or the command start it.
	autoStartFights = true
	#Whether a player's records of the four old Super Hero chapters of the Movies saga (movies_saga 106-109, up to 0.5) move to
	#this saga (chapters 4, 10, 15, 16) at login.
	#true - they move (default).    false - they are left where they were (and count for nothing).
	moveOldMoviesRecords = true

[memory]
	#Only the overworld keeps a spawn region loaded (vanilla and Forge: 23x23 full chunks plus their border, ticking all
	#the time, with nobody there). Bukkit hybrids such as Mohist and Arclight give EVERY world one (the log shows 'Preparing
	#start region for dimension ...' once per dimension); with DragonMineZ' and our worlds that is twenty or more regions held
	#in memory for good. true: at server start (and when a world loads later) the spawn ticket of every world except the
	#overworld is released, which is what vanilla does anyway, so nothing changes on a Forge-only server. Nothing of ours
	#needs those chunks: every feature that needs a chunk loaded holds its own ticket while it is used.
	#false: the worlds are left as the server made them.
	releaseSpawnRegions = true

[story]
	#Story split (docs/story_split/SPEC.md): the Dragon Ball races play the Dragon Ball Sagas, the Bleach races the Bleach Arcs.
	#Outside a party each side plays only its own story; with a party member of the other side close by (same dimension, within
	#DragonMineZ' party quest share range) a player may start, progress, turn in and claim the other side's story quests together.
	#Shared content (raids, tournaments, space, Mental Training, the God Chamber) stays open to everyone; a gate behind a Dragon Ball
	#story step also opens for a Bleach character at its Bleach step (data/dmzultra/story_split/equivalents.json).
	#true  - each race plays its own story (default).    false - every race may play every story, as before.
	storySplit = true
	#Bleach races may play the DB Sagas (fx_bl_dmz, owner 2026-11-21): the STARTING value of the world rule
	#story.bleachPlaysDragonBall for a new world (a world keeps its own value from its first start; change it in game - V menu > OPTIONS >
	#Game, Saga Setup, Utilities > World - or with /dmzultra world rules). On: a Soul Reaper, Quincy, Hollow or Fullbringer may also play
	#the Dragon Ball Sagas and side quests on their own, beside their Bleach Arcs; a Dragon Ball reward their race cannot use is skipped.
	#false - each race plays its own story (default).
	bleachPlaysDragonBall = false

[tournament_of_power]
	#Who may start a Tournament of Power (the Grand Priest in the Null Realm, the arena's Choose Battle Mode menu).
	#true - any player (default; single player and LAN always may).    false - only operators on a dedicated server.
	hostingOpen = true
	#The most fighters one universe fields in the battle royale, players and NPC fighters together (canon: 10).
	#Range: 1 ~ 10
	teamSize = 5
	#How many NPC fighters each rival universe sends by default (the host may choose fewer or more, up to teamSize).
	#Range: 1 ~ 10
	npcPerUniverse = 3
	#The royale's clock in minutes. 0 - scaled to the field (15 seconds a fighter, 3 to 48 minutes: canon's 48 minutes
	#for 80 fighters). When it runs out, the universe with the most fighters left wins.
	#Range: 0 ~ 60
	timerMinutes = 0
	#Whether a player's universe is filled up to teamSize with its own NPC fighters (Universe 7: Goku, Vegeta, Gohan...).
	#The host may turn it off for one match; false here turns it off for all.
	npcFill = true
	#How long a royale waits for other players to join a universe before the bell (the host may start at once).
	#0 - no wait. Single player never waits.
	#Range: 0 ~ 300
	signupSeconds = 45
	#Whether a universe knocked out of the royale is erased in a short scene: its god and its fighters in the stands fade
	#away (Zeno's erasure). Only an NPC universe's spectators fade and only on the screens of players who turned top.erasureScene on;
	#nobody is ever harmed. false - never shown.
	erasure = true
	#Whether the players of the winning universe are paid (XP, Zeni and gear: senzu beans and a canon outfit pattern;
	#never TP). Once per match per character. Off by default (opt-in, owner brief 2026-11-08).
	prize = false
	#The Zeni each player of the winning universe gets.
	#Range: 0 ~ 1000000
	prizeZeni = 3000
	#The experience points (Minecraft XP) each player of the winning universe gets.
	#Range: 0 ~ 100000
	prizeXp = 550

#DMZ Ultra's progression (the training revamp): Fighter Level, XP, AP and the eight stats.
#TP is no longer earned or spent: every TP gain DragonMineZ or another mod makes is paid as Fighter XP at these rates.
[rpg]
	#A stat respec after the first (free) one costs Fighter Level x this much Zeni, at most once per real day.
	#Range: 0 ~ 1000000
	respecZeniPerLevel = 500
	#SPD gives a chance to dodge an attack from a living attacker (Appendix A: up to +12 %).
	dodge = true

	#Fighter XP paid per point of TP a source would have given (SPEC Appendix B).
	[rpg.xp]
		#DragonMineZ quest TPS rewards, dialogue, raids, tournaments, wishes.
		#Range: 0.0 ~ 100.0
		story = 1.0
		#DragonMineZ' kill reward (after its repeat-target damping). Players killed outside a consented spar pay 0.
		#Range: 0.0 ~ 100.0
		kill = 1.0
		#DragonMineZ' training minigames.
		#Range: 0.0 ~ 100.0
		minigame = 1.0
		#DMZ Ultra's own rewards (arena, spars, paths, raids, missions ...). The old x3 for won fights is gone.
		#Range: 0.0 ~ 100.0
		ledger = 1.0
		#Any other mod's TP grant (DMZ Sparking, Overhaul, Plus ...).
		#Range: 0.0 ~ 100.0
		foreign = 0.5
		#Daily cap of foreign XP per character, in levels' worth of XP at the character's level (real day).
		#Range: 0.0 ~ 1000.0
		foreignDailyLevels = 1.0

#DMZ Ultra's use levels (the training revamp, SPEC 7): earned abilities, skills and forms level up by being used for real.
#Every number here is a fair-play rule (SPEC 7.2).
[rpgUse]
	#Abilities gain use-XP. Off: nothing gains, levels stay as they are.
	enabled = true
	#A timed second counts only if the player did something the server saw within this many seconds
	#(an attack, a cast, a strike, a block, a dash, a dodge, a checkpoint, an answered prompt, or steering their own flight or run).
	#Range: 5 ~ 600
	intentSeconds = 45
	#One ability gains at most need(level) x this much per minute (1/20: no level comes faster than about 20 minutes).
	#Range: 0.001 ~ 1.0
	minuteShare = 0.05
	#Doing the very same thing for longer than this many minutes falls to the factor below until the player switches.
	#Range: 1 ~ 1440
	sameMinutes = 15
	#Range: 0.0 ~ 1.0
	sameFactor = 0.5
	#Minutes of one ability per real day at the full rate; after that it gains at the factor below (never zero).
	#Range: 1 ~ 1440
	dailyFullMinutes = 90
	#Range: 0.01 ~ 1.0
	dailyFactor = 0.35
	#The hour (UTC, 0-23) at which the real day of the daily minutes starts again.
	#Range: 0 ~ 23
	dayResetHourUtc = 0
	#Hits on training dummies and punch machines count at this share.
	#Range: 0.0 ~ 1.0
	dummyFactor = 0.35
	#Hits on the same target in 30 seconds: full up to repeatSoft, falling to nothing at repeatHard.
	#Range: 1 ~ 1000
	repeatSoft = 8
	#Range: 2 ~ 1000
	repeatHard = 24
	#DragonMineZ' passive form mastery (every 5 seconds) is 0 outside a fight: mastery comes from fighting.
	passiveMasteryOff = true

#DMZ Ultra's RPG gear (the training revamp, SPEC 5). Only acts while the world's RPG mode (world rule rpg.mode) is on.
[rpgGear]
	#Graded foes, saga bosses and raid bosses drop gear and upgrade materials.
	drops = true
	#Every gear drop chance is multiplied by this (1.0 = SPEC 5.5's table).
	#Range: 0.0 ~ 10.0
	dropScale = 1.0
	#A primary roll is a share of (the AP the level curve paid by the item level + this floor).
	#Range: 0 ~ 100000
	statFloor = 150
	#Upgrade +n costs this x item level x n^2 Zeni (SPEC 5.4: 50).
	#Range: 0 ~ 1000000
	upgradeZeniPerLevel = 50
	#Bulma's price of one Reforge Capsule, in Zeni.
	#Range: 0 ~ 1000000000
	reforgePrice = 5000
	#The secondary stats act (crit, pierce, regen, lifesteal, ki cost, cooldown, flight, dodge, block, XP/Zeni/item find).
	effects = true

[space_content]
	#The worlds of every universe in space and in the Space Pod's list: Sadala and Potaufeu (Universe 6), Kanassa and
	#Arlia (Universe 7), Babari (Universe 10), the Pride Troopers' World (Universe 11). false - the pod list is exactly DragonMineZ' again.
	worlds = true
	#Eight free-market worlds of our own, one in each of Universes 1, 2, 3, 4, 5, 8, 9 and 12, each with a trading
	#outpost. Not in the anime (non-canon): on by default, like the rest of the non-canon content.
