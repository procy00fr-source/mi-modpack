#The Bleach core (com.dmzultra.r3.bleach): the per-character Bleach profile, its sync, the trial gate, migrations, notices.
[bleach]

	[bleach.master]
		#ALL Bleach content of DMZ Ultra in one switch, for a Dragon Ball only pack.
		#true - on (default): every Bleach system follows its own switches.
		#false - off: the Soul Reaper and Fullbringer races leave the character creator and the race change; the Bleach NPCs, the Hollows
		#and the traitor captain are not placed (those already in the world are taken out as their chunk loads, and come back when it is on
		#again); the Bleach sagas and quests (the trials, the Human awakening, Lost Agent) are not loaded; Bleach forms, stacks, strains and
		#techniques cannot be bought or used; Bleach items rest (out of the creative tab, they do nothing in the hand); Jinzen and the inner
		#world, the inner Hollow arena, the Visored yard, the Bleach screens, guide pages and commands (but for operators) are gone; the
		#Bleach keys stay listed in Controls (so their bindings are kept) and do nothing. Bleach recipes are left out.
		#Saves are safe: nothing is deleted. A Soul Reaper or Fullbringer keeps its race, stats and all it owned and plays on in base form;
		#everything is back when the switch is on again. Restart the server after changing it.
		enabled = true

	[bleach.core]
		#Bleach trials always open the purchase: a Bleach form or mask level whose trial quest is not done stays locked in DragonMineZ' Skills
		#menu, the masters' screen and the server, even when DragonMineZ' own saga requisite (gameplay.sagaFormRequisiteEnabled) or story
		#mode is switched off. true - on (default).    false - DragonMineZ' own rule only.
		trialsAlwaysRequired = true
		#Send each player their own Bleach profile and what others see of it (Zanpakuto, mask kit, bonded object, beast family).
