	#While the autopilot flies your ship (a leg, a fold) or it crosses a world's air, the wingmen within this many blocks travel with it in the fleet (stowed) and come out in formation when you fly by hand again; those further off wait for a call.
	#Range: 32 ~ 1024
	tokenRadius = 160
	#A party is a squadron: a member may let their wingmen follow the party leader's fleet orders (a Fleet page toggle).
	squadrons = true
	#How many ships of the same hull one character may own once the extra ones are built from a blueprint at a yard.
	#A route, a rank or Bulma still gives one of each hull; the gods' Cube is always one. Default 2.
	#Range: 1 ~ 4
	sameHullMost = 2
	#Multiplies every yard build time (small craft 2-5 minutes, frigates 15, capitals 40 at 1.0). 0.1 = ten times as fast.
	#Range: 0.01 ~ 10.0
	buildTimeScale = 1.0
	#Whether the yards build ships from blueprints (the yard consoles stay; builds already running can still be collected).
	yards = true

	[fleets.wagePerDay]
		#A wingman's pilot's wage per in-game day (Zeni).
		#Range: 0 ~ 1000000
		pilot = 400
		#A frigate's or capital's helmsman, per in-game day (Zeni).
		#Range: 0 ~ 1000000
		helmsman = 600
		#A frigate's or capital's medic, per in-game day (Zeni).
		#Range: 0 ~ 1000000
		medic = 400
		#A capital's hangar chief, per in-game day (Zeni).
		#Range: 0 ~ 1000000
		hangarChief = 500
		#A frigate's or capital's marine, per in-game day (Zeni).
		#Range: 0 ~ 1000000
		marine = 250
		#A capital's gunner, per in-game day (Zeni; a small ship's or a frigate's gunner stays wage-free).
		#Range: 0 ~ 1000000
		gunner = 300
		#A capital's mechanic, per in-game day (Zeni; a small ship's or a frigate's mechanic stays wage-free).
		#Range: 0 ~ 1000000
		mechanic = 300

#The ship paint shop (DMZ Ultra 0.6.0, lane fl_paint): colours, patterns, weathering, emblems and name plates, at the yards.
[fleetPaint]
	#Whether the paint shop is open and painted ships show their paint (off: factory paint for all; nothing is lost).
	enabled = true
	#The Zeni a repaint costs. Renaming and the factory finish are free; nothing is asked while the wallet is off.
	#Range: 0 ~ 1000000
	price = 1500
	#The standing with a faction its symbol asks for: hated, hostile, wary, neutral, known, trusted, honoured, exalted.
	factionEmblemRank = "known"
	#Refuse ship names with a blocked word (data/dmzultra/craft/paint/blocked_words.json; a data pack may add words).
	nameFilter = true

#Fleet battles: battles of big ships and craft as travel events - deployment points, waves, subsystems, wrecks, salvage.
#A battle ends, pays and leaves the galaxy as it was: never a territory war, nothing happens offline.
[fleetBattles]
	#Fleet battles on. Off: no fleet battle rolls; the plain ship fights stay.
	enabled = true
	#Fleet battles running at once on the server (one more waits until one ends).
	#Range: 1 ~ 16
	maxBattles = 4
	#The enemy's deployment points against one player (a craft 1-2, a frigate 6, a capital 16, a boss capital 24).
	#Range: 6 ~ 200
	dpSolo = 30
	#More deployment points for each further player in the party.
	#Range: 0 ~ 100
	dpPerPlayer = 12
	#The most deployment points an enemy ever fields at once.
	#Range: 6 ~ 400
	dpMost = 78
	#The most enemy and allied ships and craft alive in one battle (big ships also obey [bigShips] maxLive).
	#Range: 4 ~ 48
	shipsPerBattle = 16
	#The canon set pieces (Frieza's flagship, Cooler's squadron...: lane fl_setpieces' battle files).
	setPieces = true
	#Hunter fleets: a military faction you are HATED with sends a fleet after you on your own travels.
	hunters = true
	#In-game days between two hunter fleets after one player.
	#Range: 1 ~ 60
	hunterDays = 3
	#Pirate fleets (non-canon: they also need the world's non-canon switch).
	pirateFleets = true
	#Times a player knocked out in a battle may wake in their capital's med bay (per battle).
	#Range: 0 ~ 10
	medbayRespawns = 3
	#A battle's radius (blocks): beyond it a withdraw count starts; ten seconds out is a flight.
	#Range: 96 ~ 512
	radius = 192
	#A battle's hard limit (minutes).
	#Range: 3 ~ 19
	minutes = 15
	#Minutes an enemy wreck stays to be salvaged after it went down.
	#Range: 1 ~ 60
	wreckMinutes = 10
	#Salvage cuts in a frigate's wreck (a capital has twice as many).
	#Range: 0 ~ 20
	wreckCuts = 3
	#Escort loans: a faction that holds you HONOURED lends a ship that joins your battles.
	escortLoans = true
	#Reinforcement calls: at EXALTED, once an in-game day, call a faction wing into a battle.
	reinforcementCalls = true
	#A faction that holds you EXALTED may have a patrol near that joins your fight (spec 8.7).
	alliedPatrols = true
	#The NPC big ships' minds' time budget per battle and tick (microseconds); over it they keep their last plans.
	#Range: 100 ~ 20000
	brainMicros = 1000

#Carriers: a frigate's or a capital's hangar holds small craft on its pads - launched out of the hangar mouth, recovered
#by flying slowly into it. A docked craft is its record only (no entity) and stands on its pad as its real model.
[hangar]
	#Hangars on. Off: no launch or recovery (docked craft stay docked; Call my ship still brings one out).
	enabled = true
	#Seconds between two launches from one hangar (a hangar chief halves it, a DAMAGED hangar doubles it).
	#Range: 0.5 ~ 30.0
	launchSeconds = 3.0
	#The fastest a craft may move (blocks a tick, against its carrier) and still be taken in at the hangar mouth.
	#Range: 0.1 ~ 2.0
	recoverSpeed = 0.4
	#Share of its hull a hangar chief patches on a recovered craft (0.10 = 10%).
	#Range: 0.0 ~ 1.0
	chiefRepair = 0.1
	#Return orders send your wingmen into your carrier's hangar when you lead from one (off: they go into their capsules).
	wingsDock = true

#Fleet PvP: players' ships against players' ships, in space only, between players who opted in. Off by default.
#The stake is the repair bill of a disabled ship: never cargo, modules, hulls, blueprints, Zeni or territory; nothing happens offline.
[fleetPvp]
	#off: ship guns never hit a player's ship (default).
	#duel: one player challenges another on the Fleet page (within duelRange in space); the other accepts; a ring of duelRing blocks.
	#zones: the zones listed below are PvP space; entering one warns you; inside, ship guns hit the ships of others inside.
	#flag: each player raises or lowers a war flag on the Fleet page; flagged players' ships may fight anywhere in space.
	mode = "off"
	#PvP zones for mode = zones: "name|x|y|z|radius" in open space (radius 32 to 4096). Example: "Asteroid Arena|6000|150|-4200|400".
	zones = []
	#A PvP boarding (lane fl_board): a beaten ship may be boarded by the winner's side for a short while. It disables,
	#never captures, and takes nothing.
	boarding = false
	#The most of a ship's hull one PvP hit may take (percent).
	#Range: 1 ~ 50
	hitCapPercent = 6
	#Minutes a player whose ship was disabled in PvP stays out of PvP (they cannot be hit, nor hit).
	#Range: 1 ~ 120
	lossCooldownMinutes = 10
	#Seconds a player is out of PvP after arriving in space, logging in or respawning (no spawn-camping).
	#Range: 10 ~ 600
	arrivalGraceSeconds = 60
	#No PvP within this many blocks of a station or a shipyard pad in space (no camping at yards and stations).
	#Range: 64 ~ 2048
	guardRadius = 256
	#Minutes out of combat a lowered war flag takes to come down (mode = flag).
	#Range: 1 ~ 60
	flagLowerMinutes = 5
	#How near (blocks) a player must be to be challenged to a duel (mode = duel).
	#Range: 64 ~ 2000
	duelRange = 300
	#A duel's ring (blocks round the point where it was accepted); ten seconds outside it is a flight.
	#Range: 64 ~ 2000
	duelRing = 256
	#A duel's time limit (minutes); then it ends as a draw.
	#Range: 2 ~ 60
	duelMinutes = 10
	#Characters playing from the same address are taken as one person: they cannot fight each other
	#(no farming duel records between alts), as the Galactic Patrol's addressGuard.
	addressGuard = true

#The canon space set pieces (Frieza's flagship over Namek, the Frieza Force armada, Cooler's squadron, King Cold's
#arrival, the Patrol and Moro's escapees, the Heeter fleet): battles at the saga's moment, then weekly operations on job boards.
#Switched on and off with [fleetBattles] setPieces.
[fleetSetPieces]
	#A set piece rolls on your travels only until you win it; after that it is an operation on its faction's job board.
	#false: it may roll again on your travels as well.
	once = true
	#Send the set pieces' staged camera moments (intro, crippled flagship, escape, win). Each player still
	#chooses: the boss.stagedMoments switch (off by default), quick or long by their journey cutscene choice, and the skip key.
	staging = true
	#A big ship captured by boarding (lane fl_board) is also handed over as a ship, not only as its blueprint
	#(Frieza's and Cooler's flagships captured in their set pieces - Cooler's after movies_saga:16 - and battle saucers and Heeter
	#warships captured anywhere). Off by default (owner 2026-10-23: capture gives the blueprint).
	claimCaptured = false

#Boarding actions: cross into an enemy frigate or capital whose shields are down (a collar, a breach, a disabled ship's hatch),
#fight room by room, take the bridge to capture it or overload the reactor to scuttle it. A boarding takes minutes.
[fleetBoarding]
	#Boarding on. Off: no collar clamps and no enemy ship can be boarded.
	enabled = true
	#Boarding cells in the decks dimension (each a boarding at a time), kept apart from the ships' own cells.
	#Range: 1 ~ 16
	cells = 8
	#The most boarders in one boarding (players; your marines come on top).
	#Range: 1 ~ 12
	most = 6
	#A boarding's limit (minutes): then the crew throws the boarders out.
	#Range: 2 ~ 10
	minutes = 6
	#How near (blocks, hull to hull) your big ship must hold to an enemy for its boarding collar to clamp on.
	#Range: 4 ~ 32
	collarRange = 12
	#Seconds your big ship must hold that close before the collar clamps on.
	#Range: 1 ~ 30
	collarSeconds = 5
	#Seconds of channelled ki at a cleared room's console to turn its subsystem off outside.
	#Range: 1 ~ 30
	consoleSeconds = 5
	#Seconds the helm must be held on a cleared bridge for the ship to surrender.
	#Range: 2 ~ 60
	helmSeconds = 10
	#Seconds of channelled ki at the reactor to overload it.
	#Range: 2 ~ 60
	reactorSeconds = 8
	#The escape count (seconds) after the reactor is overloaded, before the ship breaks up.
	#Range: 10 ~ 120
	escapeSeconds = 30
	#The most hired marines (crew role Marine) who come along on one boarding.
	#Range: 0 ~ 6
	marines = 3
	#The defenders' number times this (1 = as the template says, plus a share for each further boarder).
	#Range: 0.25 ~ 3.0
	defenders = 1.0
	#A capture takes its crew prisoner when you own a ship with a brig; the Galactic Patrol's quartermaster pays a bounty for them.
	prisoners = true

[expeditions]
	#Expeditions: every world keeps a log per character - its landmarks, special areas, rare resources, native species and
	#story finds - with a completion percentage, four tiers (Scouted 25%, Mapped 50%, Explored 75%, Mastered 100%) and a reward for
	#each first discovery and each tier. Another way to grow besides training and the story; it replaces nothing. RPG mode on: Fighter
	#XP and Zeni. RPG mode off: TP and Zeni. Off: nothing is logged or paid, and the log page says so.
	enabled = true
	#Party members standing near the finder on the same world share each discovery (each is paid once, as their own).
	partyShare = true
	#How near (blocks) a party member must stand to share a discovery.
	#Range: 8 ~ 512
	partyRange = 64
	#RPG mode: flat Fighter XP per reward unit (a landmark is 2 units, a tier 4 to 14; docs/expeditions/SPEC.md 6).
	#Range: 0.0 ~ 100000.0
	xpPerUnit = 20.0
	#RPG mode: plus this percent of the XP the fighter needs for their next level, per unit (so a reward keeps
	#its worth at every level).
	#Range: 0.0 ~ 100.0
	levelPercentPerUnit = 2.0
	#RPG mode off: TP per unit, in percent of the fighter's base pay (what a foe of their own strength pays).
	#Range: 0.0 ~ 1000.0
	tpPercentPerUnit = 100.0
	#Zeni per unit (a quarter more with the RPG mode off). 0: no Zeni.
	#Range: 0 ~ 100000
	zeniPerUnit = 150
	#Every expedition reward times this (XP, TP and Zeni).
	#Range: 0.0 ~ 10.0
	rewardScale = 1.0
	#Activities (hunts, local jobs, events won, conquest) a world's completion counts. Past it they still pay, within
	#the daily caps, but the percentage no longer grows.
	#Range: 0 ~ 50
	activityGoal = 5
	#Activities that count and pay per world per real day (UTC).
	#Range: 0 ~ 50
	activitiesPerPlanetPerDay = 3
	#Activities that count and pay per character per real day, all worlds together.
	#Range: 0 ~ 200
	activitiesPerDay = 10
	#Hostile creatures or wild beasts to defeat on a world for one hunt activity.
	#Range: 1 ~ 100
	huntSize = 6
	#Tier rewards (Scouted, Mapped, Explored, Mastered): a larger payout, rolled gear in RPG mode from Explored, and the
	#world's own keepsake at Mastered.
	milestones = true
	#A world mastered goes to the living news.
	news = true

#The Galactic Patrol (DMZ Ultra, lane patrol_wanted): its wanted list on the V menu (WORLD > Bounty Board), membership
#and ranks (the Patrol's standing ladder: Cadet, Patrolman, Elite Patrolman, Patrol Captain), criminals with threat tiers D to S who
#hide on the worlds, the subdue window and the Patrol cuffs, custody and the bounty paid at a Patrol officer. Player crimes are a
#separate switch and are off by default.
[patrol]
	#The Patrol's wanted list, membership, criminals and captures.
	enabled = true
	#Dossiers on the wanted list at a time (server-wide; dispatch calls come on top).
	#Range: 3 ~ 16
	listSize = 8
	#Real hours before the dossiers nobody is hunting are replaced.
	#Range: 1 ~ 168
	rotateHours = 12
	#Dispatch calls: now and then a member with no hunt hears of a small-time criminal near them (D or C tier).
	dispatch = true
	#Real minutes between dispatch calls for one member (at most; a call comes only on a world with a hideout).
	#Range: 5 ~ 600
	dispatchMinutes = 25
	#The alignment a fighter needs to join (DragonMineZ' 0-100; the evil band, 40 and lower, never joins).
	#Range: 41 ~ 100
	joinAlignment = 50
	#The Fighter Level a fighter needs to join with the RPG mode on.
	#Range: 1 ~ 500
	joinLevel = 10
	#The base battle power a fighter needs to join with the RPG mode off.
	#Range: 0 ~ 1000000000
	joinPower = 1500
	#Seconds a beaten criminal stays down for the cuffs before getting back up.
	#Range: 4 ~ 60
	subdueSeconds = 12
	#Prisoners a member can hold in custody at once.
	#Range: 1 ~ 10
	custodySize = 3
	#The share of the bounty paid when a Patrol transport collects the prisoner (instead of handing them in).
	#Range: 0.0 ~ 1.0
	transportShare = 0.8
	#The share of the bounty paid when the criminal is killed instead of captured.
	#Range: 0.0 ~ 1.0
	killShare = 0.5
	#A multiplier on every Patrol bounty's Zeni.
	#Range: 0.0 ~ 10.0
	bountyZeni = 1.0
	#Criminals a character can be paid for a week (captures, transports and kills together).
	#Range: 0 ~ 200
	capturesPerWeek = 12
	#The top tiers are built for groups: a criminal's health and blow grow with the hunters near it.
	groupScaling = true
	#Player crimes: attacking players outside a spar, tournament, raid or duel, harming the people of a world,
	#damaging a guarded structure, destroying a planet. Witnesses report it; the criminal becomes wanted with a bounty.
	playerCrimes = false
	#How far a witness sees a crime (blocks; line of sight needed).
	#Range: 4 ~ 96
	witnessRange = 24
	#Heat a wanted player loses each real hour (a warrant lapses at 0; destroying a planet is 400 heat).
	#Range: 1 ~ 1000
	heatDecayPerHour = 20
	#Minutes a captured player spends in a Patrol cell at tier B (D half, S twice). Never more than 30.
	#Range: 1 ~ 15
	jailMinutes = 5
	#The fine that clears a warrant at once, as a share of the bounty.
	#Range: 0.0 ~ 5.0
	fineShare = 0.5
	#Wanted players a member can be paid for a week.
	#Range: 0 ~ 100
	playerCapturesPerWeek = 5
	#Characters playing from the same address are taken as one person: no crime against them, no report,
	#no capture and no bounty between them (alts cannot frame or farm).
	addressGuard = true
	#Crimes cost Galactic Patrol standing (a planet destroyer is Hated: the Patrol's hunter fleets come).
	crimeStanding = true

#Space hazards (lane space_hazards, docs/space_hazards/SPEC.md): the heat of stars, radiation belts, ion storms, debris fields,
#gravity wells and dead sectors. Some reaches of space are much harder to cross than others; the atlas shows each sector's danger and
#the autopilot warns about a hazardous leg and offers a safer course. The routes between the main canon worlds stay safe or mild.
#Hazards build up with warnings before they hurt; ships' shields and hulls take them first.
#Players see these values, pick their autopilot course and reach their look settings in one place: V > OPTIONS > Game > Space hazards.
[spaceHazards]
	#Switch of all space hazards. Off: space is as before (a star's own heat still burns, as it always did).
	enabled = true
	#How hard every hazard hits: 1 as designed, 0.5 half, 2 twice (the build-up, the drain and the harm).
	#Range: 0.1 ~ 5.0
	strength = 1.0
	#The open-space fields: ion storm fronts, debris fields, radiation pockets and dead sectors laid through every
	#universe away from the canon worlds and their lanes. Off: only the stars, the giants and the named zones of the data files.
	proceduralFields = true
	#Ships feel the hazards: shields drain, hulls heat up and take strikes (never below a tenth of the hull; a ship is
	#never disabled by a hazard). Off: a ship's riders are safe from every hazard.
	shipEffects = true
	#A hazard may kill a fighter who stays in it too long, after its warnings. Off: hazards never take the last tenth of
	#anyone's health.
	lethal = true
	#The autopilot warns about a hazardous leg and offers a safer, longer course when one exists; a pilot can always
	#keep the direct course. Off: no warnings (the autopilot still keeps out of dead sectors).
	autopilotAdvice = true

[comms]
	#Comms: crew who want to sign on, ship duel challenges, the hazard course choice, Zuno's question and the
	#orbit question wait on one page (its key, default F12) with their buttons, and the ship's log keeps wages, wingmen left behind and
	#Exchange sales; chat gets one short line per new question. Off: those systems post their old chat lines (with the clicks) again.
	enabled = true

#Sonic Break (lane zk_extras): in the air of a world, hold the Sonic Break key while flying to gather the air in front of you,
#release to break the sound barrier - a vapor cone, a boom ring and a dash toward your locked target (or straight ahead), with a
#shockwave where you arrive. Never in space or on an airless world: there is no air to break.
[zkSonicBreak]
	#Switch of the Sonic Break.
	enabled = true
	#DragonMineZ' Fly skill level that unlocks it. Every level above it carries the burst further and shortens the wait.
	#Range: 1 ~ 50
	flyLevel = 5
	#Seconds before the next Sonic Break at the unlock level (0.6 s less per Fly level above it, never under half).
	#Range: 2.0 ~ 600.0
	cooldownSeconds = 14.0
	#Share of the maximum ki a full-charge burst costs (a short charge costs about a third of it).
	#Range: 0.0 ~ 1.0
	kiShare = 0.1
	#Share of the maximum stamina a full-charge burst costs.
	#Range: 0.0 ~ 1.0
	staminaShare = 0.12
	#The arrival's shockwave pushes the target and whoever stands close (fighters you may strike only; no damage).
	shockwave = true

#The Warrior's Card (lane zk_extras): every fighter's profile card - race, forms, titles, path ranks, Patrol rank, faction,
#signature technique and a few lines they write themselves. Open it with its key (End) looking at a fighter, or from the card's
#list of fighters online, or with /dmzultra card <player>.
[zkWarriorCard]
	#Switch of the Warrior's Card.
	enabled = true
	#Players may write their own epithet and backstory on their card (off: the cards show what the game knows only).
	customText = true
	#Longest backstory a player may write, in characters.
	#Range: 40 ~ 1000
	maxLength = 280
	#Words masked out of epithets and backstories (on top of the server's own text filter, when it has one).
	#Whole words, any case.
	blockedWords = []

#Planet regrowth (lane zk_extras): a world a player destroyed leaves a debris field where it hung - a ship flown through it
#draws in its ores, Asteroid Ore and Ki Shards - and reforms on its own after a while (the atlas card says when). A world ended by
#the story (Planet Vegeta's Last Day) is never reformed here; a collapsed star stays a black hole.
[zkRegrowth]
	#Switch of planet regrowth and debris fields.
	enabled = true
	#In-game days before a destroyed world reforms (0: never on its own - the Angel Staff, a Kai or a wish only).
	#Range: 0.0 ~ 365.0
	worldDays = 5.0
	#In-game days before a destroyed moon reforms (0: never).
	#Range: 0.0 ~ 365.0
	moonDays = 3.0
	#In-game days before a destroyed gas giant reforms (0: never).
	#Range: 0.0 ~ 365.0
	gasGiantDays = 7.0
	#In-game days before a destroyed ringed world reforms (0: never).
	#Range: 0.0 ~ 365.0
	ringedDays = 6.0
	#A Hakai erases a world: it leaves no debris, and takes this many times longer to come back.
	#Range: 1.0 ~ 20.0
	hakaiFactor = 2.0
	#Destroyed worlds leave a debris field to gather from with a ship.
	debris = true
	#How much a debris field holds (1: about 30 hauls for a world, more for a ringed one, fewer for a moon).
	#Range: 0.1 ~ 10.0
	debrisAmount = 1.0
	#Seconds between two hauls while a ship's pilot flies through a field.
	#Range: 0.5 ~ 120.0
	harvestSeconds = 4.0

#The Senzu crop (lane zk_extras): Korin gives a Senzu Sprout to a fighter who drank his Ultra Divine Water; it grows only in a
#Karin Planter, drinks a notch of its basin for each bean, and gives DragonMineZ' own Senzu Beans - a few a week.
[zkSenzu]
	#Switch of the Senzu crop (the sprout, the planter's growth, Korin's gift).
	enabled = true
	#Korin gives another sprout every this many weeks (0: only the first). Weeks start on Monday, UTC.
	#Range: 0 ~ 52
	sproutWeeks = 4
	#Beans a planted sprout grows per in-game week (7 in-game days) while it has water; it holds at most 3 ripe.
	#Range: 1 ~ 21
	beansPerWeek = 3
	#How much faster a planter grows within 48 blocks of Master Korin (1: no faster).
	#Range: 1.0 ~ 5.0
	korinBoost = 1.5

#Shipwright's Keel (lane wd_keel): build a ship out of placed blocks round a keel, have Bulma inspect it, launch it after
#a pad countdown and fly it as one of your ships (free flight, space, crew, modules, paint, its cabin is its own blocks); set it
#down again as the very blocks it was, chests and all.
[wdKeel]
	#Switch of the Shipwright's Keel. Off: keels do not launch (block ships already flying still fly and set down).
	enabled = true
	#The most blocks a keel ship may have on this server (each keel's mark has its own limit under this).
	#Range: 8 ~ 4096
	maxBlocks = 4096
	#The longest side a keel ship may have, in blocks (width or length).
	#Range: 3 ~ 40
	maxEdge = 40
	#The tallest a keel ship may be, in blocks.
	#Range: 2 ~ 20
	maxHeight = 20
	#A keel launches only after Bulma has inspected the ship as it stands (any changed block asks for a new look).
	needInspection = true
	#Launching and setting down ask the land's protection for every block, as the player breaking and placing it
	#would (claims, spawn protection, adventure mode). Off: only the world border and the guarded places are checked.
	protectLand = true
	#Seconds of the launch pad countdown.
	#Range: 2 ~ 15
	countdownSeconds = 5
	#How far (blocks) a ship being set down may settle onto the ground below it.
	#Range: 0 ~ 12
	settleDrop = 4
	#The most keel ships one character may own (a ship whose keel was broken does not count: its papers go to the next keel).
	#Range: 1 ~ 20
	maxShips = 3
	#Blocks a keel never takes along (the scan stops there), as ids ("minecraft:spawner"). Natural ground, liquids,
	#loose plants, launch cradles and unbreakable blocks are never taken anyway.
	neverTake = ["minecraft:spawner", "minecraft:end_portal_frame", "minecraft:reinforced_deepslate"]
	#Keel ships take ship modules: the keel's mark gives the base slots (Mk I 3, Mk II 5, Mk III 8) and every Module Bay
	#built into the hull one more slot of its kind. Off: keel ships have no slots (fitted modules wait as misfits and can be taken off).
	moduleSlots = true
	#The most Module Bays a keel ship wires up (each mark has its own limit under this: Mk I 2, Mk II 4, Mk III 6).
	#Range: 0 ~ 8
	maxBays = 6
	#A keel standing in the world can be upgraded to its next mark at its console (the next keel's recipe without the
	#keel, or a crafted next keel); the ship keeps its record (name, crew, modules, paint) and Bulma inspects it again.
	inPlaceUpgrade = true

#The Shinjin race (docs/races_0.6/shinjin.md): earned at the end of the Kai Path - Old Kai offers it on the Comms page (F12),
#the rite is on the Sacred World of the Kais.
[shinjinrace]
	#Shinjin is earned on the Kai Path: hidden in the character creator, and a creation packet naming it is refused.
	#Off: Shinjin can be picked at creation.
	pathOnly = true
	#Old Kai offers the race change once the Kai Path's teaching is complete (every step of stage 5).
	#Off: no offer ('/dmzultra shinjin ascend' still works).
