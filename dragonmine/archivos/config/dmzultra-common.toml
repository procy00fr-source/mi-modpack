#Character slots: up to 8 characters per player, each with its own everything - DragonMineZ character and stats, DMZ Ultra paths,
#inventory, armour, Curios, ender chest, XP, effects, position and spawn point. Every existing character is slot 1, untouched;
#a backup of it is written to <world>/dmzultra/slots/<uuid>/backup/ at its first login with this version.
