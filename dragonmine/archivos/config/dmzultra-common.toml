#Scaled growth: the stronger a fighter is, the more TP, trained stats and Fighter XP everything gives them, so growth does not
#slow to a crawl as stat prices climb. Strength is DragonMineZ' own character level (the Level on its stats screen, which follows
#the stat points gained; never battle power, so forms, power release and androids do not change it). The multiplier is
#  1 + growthRate x ((level - 1) / referenceLevel) ^ (1 - diminishingReturns), at most maxMultiplier.
#A new character (level 1) gets x1. With the defaults: level 1,000 x1.5, 5,000 x2.32, 10,000 x3, 20,000 x4, 50,000+ x5.
#Only gains are scaled, once each, by the fighter's own level (a party share by the member's own); prices never are.
#Operator grants, migrations and rewards that state their exact figure (path lessons, raids, wishes, refunds: most already grow
#with the fighter) are paid as stated.
[scaledGrowth]
	#Scaled growth on (true, default) or off (false: every gain as before).
	enabled = true
	#How much the bonus grows: the extra multiplier a fighter at referenceLevel gets (2.0: x3 there). 0 switches the bonus off.
	#Range: 0.0 ~ 100.0
	growthRate = 2.0
	#How much the bonus flattens as the fighter gets stronger: 0 = none (the bonus climbs in a straight line with the level),
	#0.4 = default (each doubling of the level adds about half again as much as the last one, not twice as much),
	#0.9 = strong (the bonus comes early and then barely moves).
	#Range: 0.0 ~ 0.95
	diminishingReturns = 0.4
	#The bonus never goes past this multiplier (1.0 switches it off).
	#Range: 1.0 ~ 100.0
	maxMultiplier = 5.0
	#The DragonMineZ character level where the bonus is 1 + growthRate (10,000, the same reference DragonMineZ' own progression
	#options use). Lower it for a server with a low level cap.
	#Range: 1 ~ 1000000
	referenceLevel = 10000
	#Scale TP gains with the RPG mode off: kills, hits, DragonMineZ quests and training minigames, gravity training, sparring,
	#other mods' grants and DMZ Ultra's rewards that are not exact.
	normalTp = true
	#Scale stat training: the practice XP DragonMineZ' Dynamic Growth turns into stat points (training mode's stats switch,
	#RPG training disciplines, DragonMineZ' own growth). Skill levels keep their training-time limits and are not scaled.
	trainingMode = true
	#Scale Fighter XP in the RPG mode (so the attribute points its levels pay come as fast at a high level as the curve allows).
	rpgAttributes = true

