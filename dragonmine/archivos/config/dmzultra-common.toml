	asteroidsMax = 24
	#Most pirates in one squad (the table gives a range, headcount raises it up to this).
	#Range: 1 ~ 12
	pirateSquadMax = 6
	#A pod or vehicle is never damaged by an event (rocks push it away); the pilot may still be struck, never to death.
	#Our ship's hull takes storm rocks and pirate blows through its own rules (craftflight) whatever this says.
	vehicleSafe = true
	#Pirate ambushes.
	pirates = true
	#Drifting wrecks with salvage crates.
	derelict = true
	#Asteroid storms.
	asteroidStorm = true
	#Distress calls (a rescue, a trap).
	distress = true
	#ev_core pacing: blocks of open space a player flies to fill their event budget once (manual flight, and the whole
	#length of an autopilot leg - the fold no longer hides you). A full budget makes a roll.
	#Range: 500 ~ 200000
	distanceBudget = 6000
	#ev_core pacing: seconds of active flight in open space (moving, not parked) that fill the budget once.
	#Range: 30 ~ 86400
	timeBudget = 420
	#Chance an event starts when the budget is full (times the region's chance). A roll that fails empties a third of the budget.
	#Range: 0.0 ~ 1.0
	rollChance = 0.55
	#Most travel events one player may meet in a real hour (anti-farm; the cooldown comes on top).
	#Range: 1 ~ 60
	maxPerHour = 6
	#An autopilot leg may meet one travel event: the craft is pulled out of the fold mid-route and the flight lets go;
	#the course resumes after the event. The pilot may choose 'avoid events' on the atlas' Engage row.
	legEvents = true
	#New pilots' grace: a character's first autopilot legs (this many, landed or arrived) never meet a travel event,
	#and while the grace lasts no fight or hazard rolls for them in open space either. 0: no grace.
	#Range: 0 ~ 100
	newPilotLegs = 3
	#The grace also ends once the character reaches this level (the Fighter Level with the RPG mode on, DragonMineZ'
	#level with it off), whichever comes first. 0: only the legs end it.
	#Range: 0 ~ 100000
	newPilotLevel = 10
	#Most event rewards (claims) one character may take in a game day: Zeni, rolled gear and ship materials, and XP in the RPG
	#mode (TP outside it). The ledger's account cap comes on top.
	#Range: 1 ~ 1000
	rewardsPerDay = 16
	#Multiplies the Zeni every event pays (1 = the tables' own numbers).
	#Range: 0.0 ~ 100.0
	zeniScale = 1.0
	#Shared events (a comet crossing a universe ...) are announced to the whole server; rewards stay per player.
	sharedAnnounce = true

[capsuleCorp]
	#Capsule Corporation as the anime shows it, generated as our own structure dmzultra:capsule_corp in the Overworld:
	#the white main dome with CAPSULE CORP. in red, Bulma's lab, the garden dome, the tower, the lawn and the gravity room.
	#One per world: the first of 128 candidate sites, nearest the world's centre first (from about 220 blocks out), whose
	#plains, meadow or forest is flat and dry enough (never in oceans or mountains, never on a village or a DragonMineZ site).
	#Find it with /locate structure dmzultra:capsule_corp or /dmzultra capsulecorp locate. DragonMineZ' vegeta_pod keeps its own pod.
	#Worlds from before 0.5.3 keep the Capsule Corps they have; once they have one, no new one is built.
	#true - generate it (default), in chunks made from now on.    false - no new Capsule Corp (one already built stays).
	newLook = true
	#Bulma, Granolah, Kid Trunks and the Fullbring mentor (Marlowe) live at the world's Capsule Corp (in worlds from before
	#with several: the first one a player reached, or the old pod already rebuilt as Capsule Corp). One of each per world; any
	#other Capsule Corp stays quiet. Bulma is DragonMineZ' own Bulma: once she lives at Capsule Corp the one at DragonMineZ'
	#vegeta_pod steps aside (until a player first reaches Capsule Corp she stays at the pod). Vegeta stays at the pod.
	#true - on (default).    false - nobody is placed there, Bulma stays at the pod (those already standing stay).
	residents = true
	#Worlds from before only: a vegeta_pod site that still has DragonMineZ' small pod is rebuilt once as Capsule Corp, the
	#first time it loads (only natural ground around it is taken; a site with player-built blocks in the way waits for an operator:
	#/dmzultra capsulecorp rebuild). Capsule Corps already built over a pod always stay as they are.
	#false - pods stay DragonMineZ' pods (default).    true - rebuild them.
	rebuildPods = false

[raid]
	#Raids (combat 3.5): the Raid Board, party raids against our bosses in the raid realm, DragonMineZ' wave raids in a cell.
	#false - no raid can be launched; a live run ends at once (everyone is taken home, no rewards).
	enabled = true
	#How long the ready check waits for the party's answers.
	#Range: 10 ~ 120
	readySeconds = 30
	#A member must stand this close to the leader (blocks, same world) to be taken along.
	#Range: 8 ~ 512
	entryRange = 64
	#The time limit of a raid that names none (seconds; the clock starts when the fight starts). Out of time = a defeat.
	#Range: 120 ~ 7200
	timeLimitSeconds = 900
	#A member who disconnects keeps their place this long: logging back in returns them to the arena with their lives.
	#Range: 10 ~ 900
	rejoinSeconds = 120
	#Full-reward clears per raid per character each week; past it a clear pays Zeni only. 0 = no cap.
	#Range: 0 ~ 100
	weeklyFullClears = 3
	#Whether the weekly cap also holds in single player (off: no cap when you play alone).
	capInSinglePlayer = false
	#Whether raid members may hurt each other inside a raid arena.
	allowPvp = false
	#DragonMineZ' own raid types (Saiyan assault, Frieza invasion...) on the board, fought inside a raid cell.
	#With NeoDMZ installed they stay off (its raid watcher does not know our cells).
	dmzWaveRaids = true
	#A run that finds every arena taken waits in the queue at most this long before it is called off.
	#Range: 1 ~ 60
	queueMinutes = 10
	#The longest a run waits for its arena to stand (seconds) before it is called off.
	#Range: 5 ~ 300
	buildSeconds = 20
	#How long an ally holds the revive key (or crouches) next to a knocked-out member to bring them back.
	#Range: 1.0 ~ 30.0
	reviveSeconds = 4.0

	[raid.cells]
		#Instance cells (combat 3.4.1): private, protected arenas for raids, boss trials and Mental Training memories,
		#in the raid realm (dmzultra:raid_realm) or as pockets in our own dimensions.
		#true - on (default).    false - no cell is handed out; every caller takes its fallback (a memory in its own mind realm, a boss in place).
		enabled = true
		#How many raid cells may be live at once (raid.maxConcurrentRuns of the spec). A run that finds none free waits in
		#the raid frame's queue.
		#Range: 1 ~ 32
		maxConcurrent = 8
		#How far apart the raid cells lie in the raid realm (blocks, rounded to whole chunks). 2048 keeps every fight out of
		#sight and out of reach of the next.
		#Range: 1024 ~ 8192
		spacing = 2048
		#How many pocket cells may be live at once across our dimensions (one per Mental Training memory, inner Hollow ...).
		#Range: 1 ~ 256
		maxPockets = 64
		#How long per tick the cells may spend building or resetting arenas (ms). Building happens before anyone arrives;
		#an idle cell costs nothing.
		#Range: 0.25 ~ 20.0
		buildBudgetMs = 2.0
		#Protection inside live cells and the whole raid realm: no breaking or placing, explosions break nothing, no ender pearls,
		#no mob griefing, PvP only where the run allows it. Operators in creative may still build (the reset puts it back).
		#false - none of that (for map makers testing an arena).
		protect = true
		#Instant Transmission, Kai Kai, the Angel staff and any other trip out of a live cell are refused: the run's own
		#'leave' action is the way out (it takes the player home along the way back kept before they came).
		lockExits = true

[boss]
	#The boss kit (combat 3.4.2): raid bosses, trials, Mental Training memories and spirit duels run on it.
	#false - every start is refused; Mental Training falls back to its phase runner, raids and trials say the boss is not available.
	enabled = true
	#Extra boss health for each fighter after the first, as a share (3.14: 0.5 = +50 %). More fighters never
	#raise the boss's damage.
	#Range: 0.0 ~ 2.0
	healthPerExtraMember = 0.5
	#Everyone away from the arena (or outside it) this long ends the fight as a wipe (the reset).
	#Range: 10 ~ 600
	antiCheeseSeconds = 30

[raidBoard]
	#Set a raid terminal (it opens the Raid Board) on free floor at each Capsule Corp, once per site.
	#false - none is placed; terminals already standing stay, and players can still craft their own.
	terminalAtCapsuleCorp = true

#The Heeter race (its folder is races.newraces.heeter). Nothing here ever costs health.
[heeter]
	#Life-Force Surge on the racial key: a burst of life energy - more damage and speed for a few seconds, paid in ki
	#at once, then a strain that slows the ki's return.
	surge = true
	#Heeter Snare on sneak + the racial key: an energy net thrown at the foe you look at - mobs are rooted, players and
	#bosses only slowed (players then cannot be snared again for a while).
	snare = true
	#Family Business: more damage for every party member near you.
	family = true
	#Hunter's Fangs: every different boss or saga villain you defeat adds a fang to your necklace and a little damage
	#against bosses (/dmzultra heeter fangs lists them).
	fangs = true
	#Burnt Out: leaving Berserk Heeter (by choice, out of ki or stamina, by dying or logging out) weakens you for a
	#while, and Berserk Heeter cannot be taken again until it passes.
	burntOut = true
	#The Heeter trials (saga heeter_trials) open the purchase of Evolved Heeter (trial 2) and Berserk Heeter
	#(trial 3). Off: only TP and DragonMineZ' own rules.
	trials = true
	#Life-Force Surge: how long it burns (seconds).
	#Range: 1 ~ 60
	surgeSeconds = 8
	#Life-Force Surge: extra damage dealt (0.20 = +20%).
	#Range: 0.0 ~ 2.0
	surgeDamage = 0.2
	#Life-Force Surge: extra movement speed (0.15 = +15%).
	#Range: 0.0 ~ 1.0
	surgeSpeed = 0.15
	#Life-Force Surge: the share of maximum ki paid at once.
	#Range: 0.0 ~ 1.0
	surgeKi = 0.25
	#Strained, after a Surge: how long (seconds).
	#Range: 0 ~ 120
	strainedSeconds = 10
	#Strained: how much slower ki comes back (0.30 = 30% slower).
	#Range: 0.0 ~ 1.0
	strainedRegenCut = 0.3
	#Life-Force Surge: cooldown from the moment it is used (seconds).
	#Range: 0 ~ 600
	surgeCooldown = 40
	#Heeter Snare: how far the net flies (blocks).
	#Range: 2.0 ~ 64.0
	snareRange = 14.0
	#Heeter Snare: how long a mob stays rooted (seconds).
	#Range: 0.0 ~ 10.0
	snareMobRoot = 2.0
	#Heeter Snare: how long a player is slowed (seconds; the PvP cap is 1.5).
	#Range: 0.0 ~ 1.5
	snarePlayerSlow = 1.0
	#Heeter Snare: how much a player or a boss is slowed (0.60 = 60% slower).
	#Range: 0.0 ~ 0.9
	snareSlowShare = 0.6
	#Heeter Snare: after a snare a player cannot be snared again for this long (seconds; never under 6, the PvP rule).
	#Range: 6 ~ 60
	snarePlayerImmunity = 6
	#Heeter Snare: how long a boss is slowed (seconds; bosses are never rooted).
	#Range: 0.0 ~ 2.0
	snareBossSlow = 0.5
	#Heeter Snare: cooldown (seconds).
	#Range: 0 ~ 600
	snareCooldown = 20
	#Heeter Snare: the share of maximum ki it costs.
	#Range: 0.0 ~ 1.0
	snareKi = 0.08
	#Family Business: extra damage per party member near you (0.04 = +4%).
	#Range: 0.0 ~ 0.5
	familyPerMember = 0.04
	#Family Business: the most it gives (0.12 = +12%).
	#Range: 0.0 ~ 1.0
	familyMax = 0.12
	#Family Business: how near a party member must be (blocks).
	#Range: 1.0 ~ 128.0
	familyRadius = 16.0
	#Hunter's Fangs: extra damage against bosses and saga villains per fang (0.01 = +1%).
	#Range: 0.0 ~ 0.1
	fangBonus = 0.01
	#Hunter's Fangs: the most fangs a necklace holds (the art has 8).
	#Range: 0 ~ 8
	fangMax = 8
	#Burnt Out: how long it lasts (seconds; 0 = never Burnt Out).
	#Range: 0 ~ 600
	burntSeconds = 30
	#Burnt Out: how much STR, SKP, PWR and DEF fall (0.20 = -20%).
	#Range: 0.0 ~ 0.9
	burntCut = 0.2

#The Cerealian race (its folder is races.newraces.cerealian).
[cerealian]
	#Evolved Right Eye: ki blasts and beams deal 10% more to targets over 12 blocks away; Ki Sense reaches 15% further.
	rightEye = true
	#Evolved Left Eye: five stages opened by age (18, 25, 40, 60, 90) - longer Ki Sense, the afterimage read,
	#foresight against blows from behind and early warnings, a stat bonus at 60 and 90, True Sight at 90.
	leftEye = true
	#Hours played as a Cerealian character per year of its age.
	#Range: 0.25 ~ 24.0
	hoursPerYear = 1.5
	#The age a new Cerealian character starts at.
	#Range: 1 ~ 89
	startAge = 16
	#Sniper's Focus on the racial key (hold): zoom and reticle; a target held in the reticle for half a second is
	#marked for 6 s - your ki attacks deal 15% more to it and its power shows. 8% ki per mark, 20 s cooldown after a mark.
	focus = true
	#Survivor's Vow on sneak + the racial key: 12 s of +25% STR/SKP/PWR/DEF for 30% of your ki; it ages the character
	#by a quarter year. 180 s cooldown.
	vow = true
	#The Left Eye's stat bonus at stage V (age 90); stage IV gives half of it. Multiplied by DMZ Overhaul's
	#median form factor when Overhaul is installed.
	#Range: 0.0 ~ 1.0
	ageBonusMax = 0.2
	#The Cerealian techniques are opened by Granolah's lessons (side saga cerealian_lessons); off: bought freely.
	lessons = true
	#Left Eye stage II (25): a fighter within 32 blocks who vanishes or teleports leaves a mark where it lands,
	#seen by the Cerealian alone.
	afterimageRead = true
	#Left Eye stage III (40): heavies and saga punches aimed at the Cerealian are telegraphed 4 ticks sooner,
	#and a charged ki attack, a big swing or a boss telegraph aimed at them within 24 blocks gives a warning tick and a flash.
	earlyTelegraphs = true
	#Left Eye stage V (90), True Sight: while the Cerealian sneaks, players hiding at 0% power release (or cloaked,
	#hushed, hidden in the night) and invisible fighters within 24 blocks are outlined for them alone.
	trueSight = true

#DMZ Ultra beside other DragonMineZ addons: who runs each overlapping system (one owner per system).
#The start-up log and /dmzultra index compat show the owner table of this server.
[compat]
	#true: at server start the log prints one line per known addon found and who owns each system it overlaps.
	logSummary = true

	#DMZ Character Slots (dmzcharacterslots) installed beside DMZ Ultra.
	[compat.characterSlots]
		#true: everything DMZ Ultra keeps per character (Zeni, Destroyer ledger, living-universe rows, ...) follows the character
		#that is active in DMZ Character Slots; the first time, today's data goes to the character active at that moment.
		#false: one set of DMZ Ultra data per account while DMZ Character Slots is installed (the 0.4 behaviour).
		followActiveCharacter = true

	#Ki Overcharge (dmzkiovercharge) installed beside DMZ Ultra.
	[compat.kiOvercharge]
		#true: Ki Overcharge charges past the cap and DMZ Ultra's own Overcharge stands aside (only one mod raises the cap).
		#false: both run - charges can be drained twice; not recommended.
		standAside = true

#GT: the Omega Shenron raid, the Black Smoke hunt, the companion saga GT: The Black Star Hunt (DMZ Ultra 0.5).
#DragonMineZ' own GT saga is never changed by these switches.
[gt]

	[gt.omega]
		#The Omega Shenron raid is on the Raid Board once DragonMineZ' GT saga is finished (its quest 46_omega_shenron_final).
		#Off by default until our own Omega Shenron model is finished. The raid framework's master raid switch also applies.
		#false - the card is hidden.
		raid = false
		#Which Omega Shenron the shadow saga's quest 7 asks you to beat: 'ours' (DMZ Ultra's fighter) or 'dragonminez'
		#(DragonMineZ' own GT entity). Accepted quests finish either way while legacyCredit is on.
		shadowSagaFighter = "ours"
		#A DragonMineZ Omega Shenron beaten while shadow quest 7 is accepted still settles the quest (a bridge for worlds from 0.4).
		legacyCredit = true
		#On Story difficulty, Gogeta SSJ4 joins the Omega Shenron raid's last phase as a helper.
		storyHelper = true

	[gt.blackSmoke]
		#Too many wishes call Black Smoke Shenron: the wish counter, the Black Smoke summon, the shadow-dragon hunt and the
		#seven cracked balls that open the raid with a bonus. false - none of it; the raid is reached from the Raid Board only.
		enabled = true
		#Earth Dragon Ball summons within windowDays that prime Black Smoke.
		#Range: 4 ~ 64
		wishThreshold = 12
		#Play days the summons are counted over.
		#Range: 1 ~ 60
		windowDays = 14
		#Play days the shadow dragons roam once Black Smoke is summoned.
		#Range: 1 ~ 30
		huntDays = 7
		#Shadow dragons loose at once, per universe.
		#Range: 1 ~ 7
		maxLiveDragons = 3

	[gt.blackStar]
		#The companion saga GT: The Black Star Hunt can be taken. false - it stays installed but hidden from the quest tree.
		saga = true
		#The Black Star Dragon Balls lie on the worlds and the Black Star radar finds them.
		#false - the saga's quests take DragonMineZ' Dragon Balls instead.
		balls = true

[saga_bardock]
	#Foresight, earned in the Bardock saga (quest 4, Toolo's Gift): every so often the next blow aimed at you
	#is seen before it lands and misses, with a flash of the vision. Any race. Never against damage that ignores invulnerability.
	#true - on (default).    false - nobody has it.
	foresight = true
	#Seconds between two blows Foresight lets you see coming.
	#Range: 5 ~ 600
	foresightSeconds = 20
	#Whether the saga's fights (Toolo, Dodoria's elite, Dodoria, the last stand) start by themselves when they are
	#the current quest objective (a warning, then the fight five seconds later).
	#true - fight them (default).    false - the fights are skipped and their quests move on by themselves.
	storyFights = true
	#Whether the fights take you to their own arena (a cell: Kanassa at night, Planet Meat, the hull of Frieza's
	#ship above Planet Vegeta) and bring you back after. false - they are fought where you stand.
	cellArenas = true

#Dragon Ball Daima, the second half: chapters 101-111 inside DragonMineZ' daima_saga (lane SAGA-DAIMA2).
[saga_daima2]
	#Whether the saga's people (Panzy, Neva, Glorio, Kuu) come to a player in the Demon Realm whose next step is to talk to them.
	#They stand a few blocks away while that step waits, are never saved with the world and leave when the step is done or the
	#player leaves. Off, those steps wait for a quest NPC an operator places with DragonMineZ' story command.
	#true - they come (default).    false - nobody comes.
	escorts = true
	#With RPG mode off: whether a Majin is given the Majin legendary line when the Daima quest of its story-lock row ends
	#(Innocence Demon at quest 8, Giant Innocence Demon at 11, Super Demon at 17; DragonMineZ never sells them). Each form is given
	#once per character; DragonMineZ' legendary roll and the Time Patrol saga still give them too. RPG mode on: their story route does.
	#true - given (default).    false - only the legendary roll and the Time Patrol saga give them.
	grantLegendary = true

#World setup (DMZ Ultra 0.5): the Saga Setup tab of Create World writes saves/<world>/dmzultra/world_setup.json, and the
#world takes those values the first time it starts. A server owner can put the same file at world/dmzultra/world_setup.json before
#the first start. Guide subject 'worldsetup'; in game: Utilities > World and /dmzultra world rules.
[worldsetup]
	#Read dmzultra/world_setup.json when a world starts (true). False: new worlds take the starting values of this file only.
	readSetupFile = true
	#Single-player only: write dmzultra/card.json (your fighter, for the world list) when the world closes.
	writeCards = true
	#Apply the changes Edit World > CHANGE ON NEXT OPEN left for a world (a backup of the touched files is made first).
	overrideOnNextOpen = true

#Namekian Dragon Balls (docs/v05/namekian_dragon_balls.md): a Dragon Clan Namekian forges a set of seven balls and the
#dragon that lives in them. Anyone can hunt the balls; only those who know the dragon's words can call it. No wish ever grants
#a form, and no player dragon ever outdoes Shenron or Porunga.
[namekianBalls]
	#Living player sets (not dormant, not unmade) per home world.
	#Range: 0 ~ 7
	maxSetsPerWorld = 1
	#All living player sets on the server.
	#Range: 0 ~ 64
	maxSetsPerServer = 8
	#Living sets per account, so five Namekian slots cannot make five sets.
	#Range: 1 ~ 5
	maxSetsPerAccount = 1
	#A set may be made on the Overworld (Shenron's world).
	allowOnOverworld = true
	#A set may be made on Namek (Porunga's world).
	allowOnNamek = true
	#Dimension ids where no set may be made (plus every space world without ground). Neva's Demon Realm is listed.
	deniedWorlds = ["dragonminez:otherworld", "dragonminez:time_chamber", "dragonminez:sacredkaiplanet", "dragonminez:demon_realm", "dmzultra:space", "dmzultra:divine_realms", "dmzultra:god_chamber", "dmzultra:inner_hollow", "dmzultra:inner_world", "dmzultra:null_realm", "dmzultra:universal_arena", "dmzultra:zeno_expo", "dmzultra:zeno_palace"]
	#Dragon Clan lineage (a): DragonMineZ character classes that count as Dragon Clan while sub-races are off.
	dragonClanClasses = ["spiritualist", "cleric"]
	#Dragon Clan lineage (b): owning the dragonclan form counts.
	dragonClanForm = true
	#The saga that must be finished before the rite can be learned (saga id).
	requiredSaga = "frieza"
	#Optional level floor for the rite (0: off).
	#Range: 0 ~ 100000
	minLevel = 0
	#TP paid at the start of the Rite of Creation (realistic-scaled like form prices).
	#Range: 0 ~ 1000000000
	creationTp = 150000
	#TP of the Upgrade Rites to tiers II, III, IV and V.
	tierTp = [300000, 600000, 1200000, 2400000]
	#Seconds of channelling per stage of the rite (seven stages).
	#Range: 5 ~ 120
	riteStageSeconds = 25
	#Blocks around the shrine the balls scatter within.
	#Range: 200 ~ 5000
	scatterRadius = 1000
	#Real hours a set rests as stone after a granted wish, before the tier factor (I x1.5 ... V x0.75).
	#Range: 0 ~ 8760
	restHours = 48
	#Seconds the dragon waits for a wish.
	#Range: 30 ~ 1800
	wishTimeoutSeconds = 300
	#A character may take one granted wish from the same set per this many real days.
	#Range: 0 ~ 365
	sameSetDays = 7
	#Player-dragon wishes per account per real day, across all sets (revive targets do not count).
	#Range: 0 ~ 50
	dailyAccountCap = 2
	#A ball held this many real days without a summon of its set flies back to a new site.
	#Range: 1 ~ 60
	hoardDays = 7
	#A maker offline this many real days sends the set dormant (stone; its world slot is freed).
	#Range: 3 ~ 365
	dormantDays = 30
	#A set dormant for twice dormantDays may be inherited by another Dragon Clan Namekian at its shrine (one tier less).
	allowSuccession = true
	#Held balls drop as lying balls where their holder dies (otherwise they follow keepInventory).
	dropOnDeath = false
	#The maker may ask a Zeni offering of other summoners (refunded when no wish is made).
	allowOffering = false
	#The whole system. Off: no rite, existing balls read as stone, no summon, the radar finds nothing; records are kept.
	#(Named systemOn since 0.6.0: the old key "enabled" was written false while the system was unfinished; Forge drops that line.)
	systemOn = true

#RPG training mode (0.5): disciplines, fatigue, drive, stat growth through DragonMineZ' Dynamic Growth.
#Runs only in a world whose training mode AND its 'rpg' switch are on (/dmzultra training preset rpg).
[trainingRpg]
	#Stat points of one steady minute, as a share of what one DragonMineZ minigame minute would buy.
	#Range: 0.0 ~ 5.0
	statShare = 0.5
	#Discipline XP of one steady minute of a matching activity (the secondary discipline gets 40%).
	#Range: 1.0 ~ 10000.0
	steadyXp = 60.0
	#XP to the next level = round(levelBase x level ^ levelExponent).
	#Range: 1.0 ~ 100000.0
	levelBase = 120.0
	#Range: 0.5 ~ 4.0
	levelExponent = 1.4
	#Highest discipline level.
	#Range: 5 ~ 100
	maxLevel = 30
	#Steady minutes per discipline per real day that count in full (Daily Drive).
	#Range: 1 ~ 1440
	drivePerDisciplineMinutes = 90
	#XP factor once the Daily Drive of a discipline is spent (Plateau). Never zero.
	#Range: 0.01 ~ 1.0
	plateauFactor = 0.35
	#Fatigue gained per steady minute of training (0-100 ring).
	#Range: 0.0 ~ 20.0
	fatiguePerMinute = 1.0
	#Real minutes of not training per point of fatigue recovered (online or offline).
	#Range: 0.1 ~ 60.0
	fatigueRecoveryMinutes = 2.0
	#Most steady minutes the Rested pool holds (spent at x1.5).
	#Range: 0 ~ 600
	restedCapMinutes = 30
	#Minutes of the same activity before its Freshness starts to drop.
	#Range: 1 ~ 600
	monotonyAfterMinutes = 15
	#Partner bonus (another player training within 16 blocks).
	#Range: 0.0 ~ 2.0
	partnerBonus = 0.15
	#Mentor bonus for the student (a party member 10+ levels higher trains nearby).
	#Range: 0.0 ~ 2.0
	mentorBonus = 0.25
	#Rate of field training (real fights) against training on purpose.
	#Range: 0.0 ~ 2.0
	fieldRate = 0.5
	#Minutes per real day the Time Chamber's x1.5 applies.
	#Range: 0 ~ 1440
	chamberMinutesPerDay = 60
	#Cap on the product of the positive multipliers.
	#Range: 1.0 ~ 20.0
	multiplierCap = 3.0
	#Milestone passives (ranks 15 and 30; +10% at most on any number). The world's own switch can turn them off too.
	passives = true
	#Share of a skill level one lump award may fill.
	#Range: 0.01 ~ 1.0
	lumpCap = 0.35
	#Share of blows on players outside a spar session.
	#Range: 0.0 ~ 1.0
	pvpShare = 0.5
	#Meditation breath prompts: shortest gap in seconds.
	#Range: 5 ~ 600
	promptMinSeconds = 20
	#Meditation breath prompts: longest gap in seconds.
	#Range: 5 ~ 600
	promptMaxSeconds = 40
	#A course run ends after this many minutes.
	#Range: 1 ~ 120
	courseTimeoutMinutes = 10
	#Stand the stat feed down when a mod that rewrites DragonMineZ' Dynamic Growth is loaded (DMZ Overhaul).
	#Disciplines and skills keep working either way.
	statFeedStandDown = true

#Heritage (docs/v05/races_expansion.md 3): the race's own progression track - five ranks earned by level, the race's
#trial quest and a deed of its own mechanic in real fights; a trait card at ranks 1-4, the capstone at 5; racial key levels
#bought with TP. Heritage never grants a form or a key level: it only opens purchases.
[heritage]
	#Master switch. Off: no page, no quests, no key levels on sale, traits inactive (all kept in the save).
	#Ships off until every race lane of races_expansion.md has merged.
	enabled = false
	#Racial key levels (the heritageart_<race> skills, five levels bought with TP; level N needs Heritage rank N-1).
	#Off: levels above 1 are priced -1 (owned levels stay).
	keyLevels = true
	#Character level each rank needs (ranks 1-5; kept in order).
	rankLevels = [100, 400, 900, 1600, 2500]
	#TP each rank's trial pays once per character (through the reward ledger).
	trialTp = [10000, 40000, 120000, 300000, 700000]
	#TP price of the racial key's five levels (level 1 is free and every member holds it; -1 locks a level).
	keyPrices = [0, 400000, 1200000, 3000000, 7000000]
	#Trait respec at the race's master: the first is free, then this many Zeni, doubling each time.
	#Range: 0 ~ 100000000
	respecZeni = 5000
	#Real hours between two respecs.
	#Range: 0 ~ 720
