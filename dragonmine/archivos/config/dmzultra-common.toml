#Switches for a public (dedicated) server. The defaults change nothing in single-player or on a LAN world.
#A ready-made preset for a public server is in docs/server/SERVER_SETUP.md.
[server]
	#The testers' commands: /dmzultra test ... (every branch: forms, trials, bosses, events, unlocks, Bleach, nballs ...),
	#/dmzultra finishsagas and the 'test' sub-commands of /dmzultra drills, gods and hazards.
	#true - registered as before (operators, and the owner of a single-player world); false - not registered at all, so no
	#staff member can use them (a public server). Takes effect at the next start or /reload.
	testCommands = true
	#Ki craters respect land claims (Open Parties and Claims, FTB Chunks): a ki blast, beam, wave or impact takes no block of
	#a claimed chunk unless it was fired by the claim's owner or a member of the owner's party/team. While a claim mod is
	#installed but its claims cannot be read, no player crater is made at all. Spawn protection (server.properties
	#spawn-protection) is respected too on a dedicated server, except by operators.
	#true - default; false - claims and spawn protection are not asked (only DragonMineZ' game rules and Ultra's ki-proof worlds).
	kiGriefRespectsClaims = true
	#Players' ki craters only in the wilderness: no player-made crater in any claimed chunk (even the player's own), inside
	#spawn protection, or anywhere a protection add-on (UltraCore) refuses. Creatures' craters follow kiGriefRespectsClaims.
	#false - default; true - a public server (owner decision: 'ki craters: wilderness only').
	kiGriefWildernessOnly = false
	#Powers that seize another player - the Angel's moment, the Taimu-jin Time Skip, grabs, absorption, Hakai - never touch
	#a player inside spawn protection, inside a claim the user is not a member of, or while the server's PvP is off.
	#Players who are not PvP-able are never seized. true - default; false - only each power's own rules.
	playerPowersGuard = true

